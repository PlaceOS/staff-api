services:
  db:
    #hostname: staff_api_db
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: staff_api_test
    ports:
      - 5432:5432

  redis:
    image: eqalpha/keydb
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: ${PWD}/spec/migration
    container_name: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      GITHUB_ACTION: ${GITHUB_ACTION:-}
      PG_DATABASE_URL: postgresql://postgres:password@db:5432/staff_api_test

  test:
    image: placeos/service-spec-runner:${CRYSTAL_VERSION:-latest}
    hostname: staff_api
    volumes:
      - ${PWD}/spec:/app/spec
      - ${PWD}/src:/app/src
      - ${PWD}/lib:/app/lib
      - ${PWD}/shard.lock:/app/shard.lock
      - ${PWD}/shard.override.yml:/app/shard.override.yml
      - ${PWD}/shard.yml:/app/shard.yml.input
      - ${PWD}/coverage:/app/coverage
    depends_on:
      - migrator
      - db
      - redis
    security_opt:
      - seccomp:unconfined
    environment:
      PG_DATABASE_URL: postgresql://postgres:password@db:5432/staff_api_test
      REDIS_URL: redis://redis:6379
      GITHUB_ACTION: ${GITHUB_ACTION-}
