<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking</title>
<!--
  The booking card (MCP Apps), rendered for bookings_show. Shows a booking; its owner
  (user_id/user_email or booked_by_id/booked_by_email) can edit it with bookings_edit or
  cancel it with bookings_destroy.
  Talks to the host with JSON-RPC over postMessage (ui/initialize, ui/notifications/tool-result,
  tools/call). Tool results are the {status, headers, body} envelope as structuredContent.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1d1f23; --muted: #6b7079; --line: #e3e5e9; --chip: #f1f3f6;
    --accent: #2f6fde; --accent-fg: #ffffff; --danger: #b42318; --ok: #1e6b3a; --error: #b42318;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
      --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
    --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.4; }
  h1 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  section { margin-top: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.wide { grid-column: 1 / -1; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; min-height: 56px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.6; cursor: default; }
  form .actions { grid-column: 1 / -1; margin-top: 4px; }
  .status { margin-top: 8px; min-height: 1.4em; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
  // ---- host bridge: JSON-RPC over postMessage (MCP Apps) ----
  const app = document.getElementById("app");
  let nextId = 1;
  const pending = new Map();
  let toolInput = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "request failed")) : resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-input": toolInput = (msg.params && msg.params.arguments) || {}; break;
      case "ui/notifications/tool-result": showResult(msg.params); break;
      case "ui/notifications/host-context-changed": applyContext(msg.params); break;
      case "ui/resource-teardown": send({ jsonrpc: "2.0", id: msg.id, result: {} }); break;
      default:
        if (msg.id !== undefined && msg.method) send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "method not found" } });
    }
  });

  function applyContext(context) {
    if (context && context.theme) document.documentElement.dataset.theme = context.theme;
  }

  // a tool result's {status, headers, body} envelope
  function envelope(result) {
    const content = result && result.structuredContent;
    if (content && typeof content.status === "number") return content;
    const text = result && result.content && result.content.find((item) => item.type === "text");
    try { return text ? JSON.parse(text.text) : null; } catch { return null; }
  }

  function errorText(response, fallback) {
    const body = response && response.body;
    const detail = body && (typeof body === "string" ? body : body.message || body.error);
    return detail ? `${fallback}: ${detail}` : fallback;
  }

  // calls a tool, returning the response body or throwing the error
  async function callTool(name, args, failure) {
    const result = await request("tools/call", { name, arguments: args });
    const response = envelope(result);
    if ((result && result.isError) || !response || response.status >= 400) throw new Error(errorText(response, failure));
    return response.body;
  }

  // the signed in user, for deciding which actions to offer
  let me = null;
  function currentUser() {
    me = me || callTool("users_current", {}, "Unable to load your profile").catch(() => ({}));
    return me;
  }

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child);
    return node;
  }

  function setStatus(text, kind = "") {
    const status = document.getElementById("status");
    if (status) { status.textContent = text; status.className = `status ${kind}`; }
  }

  // ---- time: epochs shown and entered in an IANA timezone ----
  const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function zoneOf(tz) { try { new Intl.DateTimeFormat(undefined, { timeZone: tz }); return tz; } catch { return localZone; } }
  const fmtTime = (epoch, tz) => new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  const fmtDay = (epoch, tz) => new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  // {date: "YYYY-MM-DD", time: "HH:MM"} of an epoch in a timezone
  function wallClock(epoch, tz) {
    const parts = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: zoneOf(tz) }).formatToParts(new Date(epoch * 1000));
    const part = (type) => parts.find((item) => item.type === type).value;
    return { date: `${part("year")}-${part("month")}-${part("day")}`, time: `${part("hour")}:${part("minute")}` };
  }
  // the epoch of a date and time in a timezone
  function zonedEpoch(date, time, tz) {
    const [y, m, d] = date.split("-").map(Number);
    const [h, mi] = time.split(":").map(Number);
    const target = Date.UTC(y, m - 1, d, h, mi) / 1000;
    let epoch = target;
    for (let i = 0; i < 2; i++) {
      const wall = wallClock(epoch, tz);
      const [wy, wm, wd] = wall.date.split("-").map(Number);
      const [wh, wmi] = wall.time.split(":").map(Number);
      epoch += target - Date.UTC(wy, wm - 1, wd, wh, wmi) / 1000;
    }
    return epoch;
  }
  const nextQuarterHour = () => Math.ceil(Date.now() / 900000) * 900;

  // keep the host's frame the size of the content
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }).observe(document.body);

  function start(name) {
    request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name, version: "1.0.0" },
      appCapabilities: {},
    }).then((result) => {
      applyContext(result && result.hostContext);
      notify("ui/notifications/initialized", {});
    }).catch(() => notify("ui/notifications/initialized", {}));
  }

  // ---- the booking card: shows a booking, its owner can edit or cancel it ----
  let booking = null;
  let mode = "view"; // view | edit | confirm-cancel
  let busy = false;

  const STATES = {
    reserved: "Reserved", checked_in: "Checked in", checked_out: "Checked out", no_show: "No show",
    rejected: "Rejected", cancelled: "Cancelled", ended: "Ended",
  };
  const stateOf = (b) => String(b.current_state || "").toLowerCase().replace(/([a-z])([A-Z])/g, "$1_$2");
  const lower = (value) => String(value || "").toLowerCase();

  function isOwner(user) {
    if (!user || !booking) return false;
    const ids = [booking.user_id, booking.booked_by_id];
    const emails = [lower(booking.user_email), lower(booking.booked_by_email)];
    return (user.id && ids.includes(user.id)) || (user.email && emails.includes(lower(user.email)));
  }

  function canChange(user) {
    const state = stateOf(booking);
    return isOwner(user) && !booking.deleted && !["cancelled", "rejected", "ended", "no_show", "checked_out"].includes(state) && booking.booking_end > Date.now() / 1000;
  }

  function showResult(result) {
    const response = envelope(result);
    if (!response || response.status >= 400 || !response.body || !response.body.id) {
      app.replaceChildren(el("p", { class: "status error" }, errorText(response, "Unable to load the booking")));
      return;
    }
    booking = response.body;
    mode = "view";
    render();
  }

  // the arguments that identify this booking (and occurrence) in tool calls
  function target() {
    const args = { id: booking.id };
    if (booking.instance) args.instance = booking.instance;
    return args;
  }

  async function render(message, kind) {
    const user = await currentUser();
    const tz = booking.timezone || localZone;
    const state = stateOf(booking);
    const kindLabel = (booking.booking_type || "booking").replace(/[_-]/g, " ");
    const when = booking.all_day
      ? `${fmtDay(booking.booking_start, tz)}, all day`
      : `${fmtDay(booking.booking_start, tz)}, ${fmtTime(booking.booking_start, tz)} – ${fmtTime(booking.booking_end, tz)}`;
    const host = booking.user_name || booking.user_email;
    const bookedBy = lower(booking.booked_by_email) !== lower(booking.user_email) ? booking.booked_by_name || booking.booked_by_email : null;

    app.replaceChildren(
      el("div", { class: "row between" },
        el("h1", {}, booking.title || kindLabel.replace(/^./, (c) => c.toUpperCase())),
        el("span", { class: "chip" }, booking.deleted ? "Cancelled" : STATES[state] || state || "Booked")),
      el("dl", {},
        el("dt", {}, "When"), el("dd", {}, when, tz !== localZone ? el("span", { class: "muted" }, ` (${tz})`) : null),
        el("dt", {}, "Type"), el("dd", {}, kindLabel),
        booking.asset_name || booking.asset_id ? [el("dt", {}, "Asset"), el("dd", {}, booking.asset_name || booking.asset_id)] : null,
        host ? [el("dt", {}, "For"), el("dd", {}, host)] : null,
        bookedBy ? [el("dt", {}, "Booked by"), el("dd", {}, bookedBy)] : null,
        booking.approved ? [el("dt", {}, "Approval"), el("dd", {}, "Approved")] : null,
        booking.description ? [el("dt", {}, "Notes"), el("dd", {}, booking.description)] : null),
      canChange(user) ? actions(tz) : null,
      el("div", { id: "status", class: `status ${kind || ""}`, role: "status" }, message || ""),
    );
  }

  function actions(tz) {
    if (mode === "edit") return editForm(tz);
    if (mode === "confirm-cancel") {
      return el("div", { class: "actions" },
        el("span", {}, "Cancel this booking?"),
        el("button", { type: "button", class: "danger", disabled: busy, onclick: cancelBooking }, "Yes, cancel it"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Keep it"));
    }
    return el("div", { class: "actions" },
      el("button", { type: "button", class: "primary", onclick: () => { mode = "edit"; render(); } }, "Edit"),
      el("button", { type: "button", class: "danger", onclick: () => { mode = "confirm-cancel"; render(); } }, "Cancel booking"));
  }

  function editForm(tz) {
    const starting = wallClock(booking.booking_start, tz);
    const ending = wallClock(booking.booking_end, tz);
    return el("form", { onsubmit: save },
      el("label", { class: "wide" }, "Title", el("input", { name: "title", value: booking.title || "", maxlength: "200" })),
      el("label", { class: "wide" }, "Date", el("input", { name: "date", type: "date", required: true, value: starting.date })),
      el("label", {}, "Start", el("input", { name: "start", type: "time", required: true, value: starting.time, step: "300" })),
      el("label", {}, "End", el("input", { name: "end", type: "time", required: true, value: ending.time, step: "300" })),
      el("label", { class: "wide" }, "Notes", el("textarea", { name: "description" }, booking.description || "")),
      el("div", { class: "actions" },
        el("button", { type: "submit", class: "primary", disabled: busy }, busy ? "Saving…" : "Save"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Back")));
  }

  async function save(event) {
    event.preventDefault();
    const form = event.target;
    const tz = booking.timezone || localZone;
    const start = zonedEpoch(form.date.value, form.start.value, tz);
    const end = zonedEpoch(form.date.value, form.end.value, tz);
    if (end <= start) return setStatus("The end must be after the start", "error");

    // only send what changed, so unchanged times don't trigger a clash check
    const args = target();
    if (form.title.value.trim() !== (booking.title || "")) args.title = form.title.value.trim();
    if (form.description.value !== (booking.description || "")) args.description = form.description.value;
    if (start !== booking.booking_start) args.booking_start = start;
    if (end !== booking.booking_end) args.booking_end = end;
    if (Object.keys(args).length === Object.keys(target()).length) { mode = "view"; return render("Nothing changed"); }

    busy = true;
    setStatus("Saving…");
    try {
      booking = await callTool("bookings_edit", args, "The booking couldn't be saved");
      busy = false;
      mode = "view";
      render("Booking updated", "ok");
    } catch (error) {
      busy = false;
      setStatus(error.message, "error");
      form.querySelector("button[type=submit]").disabled = false;
    }
  }

  async function cancelBooking() {
    busy = true;
    setStatus("Cancelling…");
    try {
      await callTool("bookings_destroy", target(), "The booking couldn't be cancelled");
      booking = await callTool("bookings_show", target(), "Unable to reload the booking").catch(() => ({ ...booking, deleted: true }));
      busy = false;
      mode = "view";
      render("Booking cancelled", "ok");
    } catch (error) {
      busy = false;
      mode = "view";
      render(error.message, "error");
    }
  }

  start("placeos-booking-card");
})();
</script>
</body>
</html>
