<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person</title>
<!--
  The staff card (MCP Apps), rendered for staff_show. Shows a person with their photo
  (staff_photo), email and phone links and books a meeting with them via events_book.
  When they've booked a desk, offers the free desks nearest to them (desks_nearby, bookings_book).
  Talks to the host with JSON-RPC over postMessage (ui/initialize, ui/notifications/tool-result,
  tools/call). Tool results are the {status, headers, body} envelope as structuredContent.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1d1f23; --muted: #6b7079; --line: #e3e5e9; --chip: #f1f3f6;
    --accent: #2f6fde; --accent-fg: #ffffff; --danger: #b42318; --ok: #1e6b3a; --error: #b42318;
    --busy: #fde8e8; --busy-fg: #9b1c1c; --free: #e7f6ec; --free-fg: #1e6b3a; --warn: #9a5b00;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
      --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066;
      --busy: #3a2224; --busy-fg: #f4b4b4; --free: #1f3327; --free-fg: #9fdcb3; --warn: #f5c26b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
    --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066;
      --busy: #3a2224; --busy-fg: #f4b4b4; --free: #1f3327; --free-fg: #9fdcb3; --warn: #f5c26b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.4; }
  h1 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  section { margin-top: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.wide { grid-column: 1 / -1; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; min-height: 56px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.6; cursor: default; }
  form .actions { grid-column: 1 / -1; margin-top: 4px; }
  .status { margin-top: 8px; min-height: 1.4em; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  section:empty { display: none; }
  ul.desks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  ul.desks li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  a { color: var(--accent); }
  .slots-title { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  ol.slots { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 220px; overflow: auto; }
  .slot { border-radius: 6px; padding: 5px 10px; display: flex; gap: 12px; font-size: 13px; }
  .slot time { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 112px; }
  .slot.busy { background: var(--busy); color: var(--busy-fg); }
  .slot.free { background: var(--free); color: var(--free-fg); cursor: pointer; border: 0; text-align: left; font: inherit; font-size: 13px; width: 100%; }
  .note { grid-column: 1 / -1; font-size: 12px; color: var(--warn); min-height: 1.2em; }
  label.check { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; color: var(--fg); font-size: 14px; }
  label.check input { width: auto; }
  #rooms { grid-column: 1 / -1; display: grid; gap: 8px; }
  #rooms:empty { display: none; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
  // ---- host bridge: JSON-RPC over postMessage (MCP Apps) ----
  const app = document.getElementById("app");
  let nextId = 1;
  const pending = new Map();
  let toolInput = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "request failed")) : resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-input": toolInput = (msg.params && msg.params.arguments) || {}; break;
      case "ui/notifications/tool-result": showResult(msg.params); break;
      case "ui/notifications/host-context-changed": applyContext(msg.params); break;
      case "ui/resource-teardown": send({ jsonrpc: "2.0", id: msg.id, result: {} }); break;
      default:
        if (msg.id !== undefined && msg.method) send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "method not found" } });
    }
  });

  function applyContext(context) {
    if (context && context.theme) document.documentElement.dataset.theme = context.theme;
  }

  // a tool result's {status, headers, body} envelope
  function envelope(result) {
    const content = result && result.structuredContent;
    if (content && typeof content.status === "number") return content;
    const text = result && result.content && result.content.find((item) => item.type === "text");
    try { return text ? JSON.parse(text.text) : null; } catch { return null; }
  }

  function errorText(response, fallback) {
    const body = response && response.body;
    const detail = body && (typeof body === "string" ? body : body.message || body.error);
    return detail ? `${fallback}: ${detail}` : fallback;
  }

  // calls a tool, returning the response body or throwing the error
  async function callTool(name, args, failure) {
    const result = await request("tools/call", { name, arguments: args });
    const response = envelope(result);
    if ((result && result.isError) || !response || response.status >= 400) throw new Error(errorText(response, failure));
    return response.body;
  }

  // the signed in user, for deciding which actions to offer
  let me = null;
  function currentUser() {
    me = me || callTool("users_current", {}, "Unable to load your profile").catch(() => ({}));
    return me;
  }

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child);
    return node;
  }

  function setStatus(text, kind = "") {
    const status = document.getElementById("status");
    if (status) { status.textContent = text; status.className = `status ${kind}`; }
  }

  // ---- time: epochs shown and entered in an IANA timezone ----
  const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function zoneOf(tz) { try { new Intl.DateTimeFormat(undefined, { timeZone: tz }); return tz; } catch { return localZone; } }
  const fmtTime = (epoch, tz) => new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  const fmtDay = (epoch, tz) => new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  // {date: "YYYY-MM-DD", time: "HH:MM"} of an epoch in a timezone
  function wallClock(epoch, tz) {
    const parts = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: zoneOf(tz) }).formatToParts(new Date(epoch * 1000));
    const part = (type) => parts.find((item) => item.type === type).value;
    return { date: `${part("year")}-${part("month")}-${part("day")}`, time: `${part("hour")}:${part("minute")}` };
  }
  // the epoch of a date and time in a timezone
  function zonedEpoch(date, time, tz) {
    const [y, m, d] = date.split("-").map(Number);
    const [h, mi] = time.split(":").map(Number);
    const target = Date.UTC(y, m - 1, d, h, mi) / 1000;
    let epoch = target;
    for (let i = 0; i < 2; i++) {
      const wall = wallClock(epoch, tz);
      const [wy, wm, wd] = wall.date.split("-").map(Number);
      const [wh, wmi] = wall.time.split(":").map(Number);
      epoch += target - Date.UTC(wy, wm - 1, wd, wh, wmi) / 1000;
    }
    return epoch;
  }
  const nextQuarterHour = () => Math.ceil(Date.now() / 900000) * 900;

  // keep the host's frame the size of the content
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }).observe(document.body);

  function start(name) {
    request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name, version: "1.0.0" },
      appCapabilities: {},
    }).then((result) => {
      applyContext(result && result.hostContext);
      notify("ui/notifications/initialized", {});
    }).catch(() => notify("ui/notifications/initialized", {}));
  }

  // ---- the staff card: a person's details, with links and a meeting booking form ----
  let person = null;
  let photo = null;
  let busy = false;
  // the free desks near the person's desk booking, from desks_nearby
  let nearby = null;

  function showResult(result) {
    const response = envelope(result);
    if (!response || response.status >= 400 || !response.body || !(response.body.email || response.body.name)) {
      app.replaceChildren(el("p", { class: "status error" }, errorText(response, "Unable to load this person")));
      return;
    }
    person = response.body;
    schedule = null;
    rooms = null;
    render();
    loadPhoto();
    loadDesks();
    loadSchedule();
  }

  // ---- when we're both free: staff_free_busy for the form's date, shown as slots ----
  // {date, people: [{email, busy: [{start, end}]}]} or {date, error}
  let schedule = null;
  const DAY_FROM = "07:00";
  const DAY_TO = "19:00";

  const form = () => document.querySelector("#meeting");
  const lower = (value) => String(value || "").toLowerCase();
  let myEmail = null; // from users_current
  const isMe = (email) => !!myEmail && myEmail === lower(email);
  const nextDay = (date) => {
    const [y, m, d] = date.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + 1)).toISOString().slice(0, 10);
  };

  // the meeting's {start, end} epochs, from the form
  function meetingTime() {
    const meeting = form();
    if (!meeting || !meeting.elements.date.value || !meeting.elements.start.value) return null;
    const start = zonedEpoch(meeting.elements.date.value, meeting.elements.start.value, localZone);
    return { start, end: start + Number(meeting.elements.duration.value) * 60 };
  }

  async function loadSchedule() {
    const meeting = form();
    if (!meeting || !meeting.elements.date.value) return;
    const date = meeting.elements.date.value;
    if (schedule && schedule.date === date) return;
    schedule = { date, loading: true };
    refresh("availability", availabilityView);
    myEmail = lower((await currentUser()).email) || null;
    try {
      const people = await callTool("staff_free_busy", {
        id: person.email,
        period_start: zonedEpoch(date, "00:00", localZone),
        period_end: zonedEpoch(nextDay(date), "00:00", localZone),
      }, "Unable to check calendars");
      if (schedule.date === date) schedule = { date, people };
    } catch (error) {
      if (schedule.date === date) schedule = { date, error: error.message };
    }
    refresh("availability", availabilityView);
    checkTime();
  }

  // who's busy at an epoch: ["Jane", "You"]
  function busyAt(from, to) {
    const first = String(person.name || "").split(" ")[0] || person.email;
    return ((schedule && schedule.people) || [])
      .filter((entry) => entry.busy.some((period) => period.start < to && period.end > from))
      .map((entry) => isMe(entry.email) ? "You" : first);
  }

  // the day between DAY_FROM and DAY_TO split where anyone's busy times start or end
  function slots() {
    const from = zonedEpoch(schedule.date, DAY_FROM, localZone);
    const to = zonedEpoch(schedule.date, DAY_TO, localZone);
    const edges = new Set([from, to]);
    for (const entry of schedule.people) {
      for (const period of entry.busy) {
        if (period.start > from && period.start < to) edges.add(period.start);
        if (period.end > from && period.end < to) edges.add(period.end);
      }
    }
    const times = [...edges].sort((a, b) => a - b);
    const result = [];
    for (let i = 0; i < times.length - 1; i++) {
      const who = busyAt(times[i], times[i + 1]).join(" & ");
      const last = result[result.length - 1];
      if (last && last.who === who) last.end = times[i + 1];
      else result.push({ start: times[i], end: times[i + 1], who });
    }
    return result;
  }

  function availabilityView() {
    if (!schedule) return el("div", { id: "availability", class: "wide" });
    let body;
    if (schedule.loading) body = el("p", { class: "muted" }, "Checking calendars…");
    else if (schedule.error) body = el("p", { class: "status error" }, schedule.error);
    else {
      body = el("ol", { class: "slots" }, slots().map((slot) => {
        const range = el("time", {}, `${fmtTime(slot.start, localZone)} – ${fmtTime(slot.end, localZone)}`);
        if (slot.who) return el("li", { class: "slot busy" }, range, el("span", {}, `${slot.who} busy`));
        return el("li", {}, el("button", { type: "button", class: "slot free", title: "Start the meeting at this time", onclick: () => pickStart(slot.start) }, range, el("span", {}, "Both free")));
      }));
    }
    return el("div", { id: "availability", class: "wide", style: "display:grid;gap:4px" }, el("span", { class: "slots-title" }, "Availability"), body);
  }

  function pickStart(epoch) {
    const meeting = form();
    const now = nextQuarterHour();
    meeting.elements.start.value = wallClock(Math.max(epoch, now), localZone).time;
    timeChanged();
  }

  // warns, without blocking, when someone's busy at the chosen time
  function checkTime() {
    const note = document.getElementById("time-note");
    const time = meetingTime();
    if (!note) return;
    const who = time && schedule && schedule.people ? busyAt(time.start, time.end) : [];
    note.textContent = who.length ? `${who.join(" & ")} ${who.length > 1 || who[0] === "You" ? "are" : "is"} busy then` : "";
  }

  function timeChanged() {
    checkTime();
    scheduleRooms();
  }

  // ---- an optional room: spaces_free lists the rooms free for the meeting ----
  // {key, buildings, zone_id, spaces} or {key, loading} or {key, error}
  let rooms = null;
  let roomTimer = null;
  const BUILDING_KEY = "placeos-staff-card-building";
  const savedBuilding = () => { try { return localStorage.getItem(BUILDING_KEY) || undefined; } catch { return undefined; } };
  const saveBuilding = (id) => { try { localStorage.setItem(BUILDING_KEY, id); } catch { /* not kept */ } };
  const roomWanted = () => form() && form().elements.room_wanted.checked;

  function scheduleRooms() {
    clearTimeout(roomTimer);
    if (roomWanted()) roomTimer = setTimeout(loadRooms, 400);
  }

  async function loadRooms(zoneId) {
    const time = meetingTime();
    if (!roomWanted() || !time) return;
    const zone = zoneId || (rooms && rooms.zone_id) || savedBuilding();
    const key = `${time.start}-${time.end}-${zone || ""}`;
    if (rooms && rooms.key === key && !rooms.error) return;
    const buildings = rooms && rooms.buildings;
    rooms = { key, loading: true, buildings, zone_id: zone };
    refresh("rooms", roomsView);
    try {
      const args = { period_start: time.start, period_end: time.end, capacity: 2 };
      if (zone) args.zone_id = zone;
      const found = await callTool("spaces_free", args, "Unable to find free rooms");
      if (rooms.key === key) rooms = { key, ...found };
    } catch (error) {
      if (rooms.key !== key) return;
      // a remembered building that's gone, look again without it
      if (zone && zone === savedBuilding() && !zoneId) {
        try { localStorage.removeItem(BUILDING_KEY); } catch { /* not kept */ }
        rooms = { buildings, zone_id: undefined };
        return loadRooms();
      }
      rooms = { key, buildings, zone_id: zone, error: error.message };
    }
    refresh("rooms", roomsView);
  }

  function roomsView() {
    if (!roomWanted() || !rooms) return el("div", { id: "rooms" });
    const buildings = rooms.buildings || [];
    const picker = buildings.length > 1 ? el("label", { class: "wide" }, "Building", el("select", {
      name: "building",
      onchange: (event) => { if (event.target.value) { saveBuilding(event.target.value); loadRooms(event.target.value); } },
    }, el("option", { value: "", selected: !rooms.zone_id }, "Choose a building"),
      buildings.map((zone) => el("option", { value: zone.id, selected: zone.id === rooms.zone_id }, zone.display_name || zone.name)))) : null;

    let body = null;
    if (rooms.loading) body = el("p", { class: "muted" }, "Finding free rooms…");
    else if (rooms.error) body = el("p", { class: "status error" }, rooms.error);
    else if (rooms.zone_id && !(rooms.spaces || []).length) body = el("p", { class: "muted" }, "No rooms are free then, try another time.");
    else if (rooms.zone_id) {
      body = el("label", { class: "wide" }, "Room", el("select", { name: "system_id" },
        rooms.spaces.map((space) => el("option", { value: space.id }, `${space.display_name || space.name} · seats ${space.capacity}${space.approval ? " · needs approval" : ""}`))));
    }
    return el("div", { id: "rooms" }, picker, body);
  }

  function refresh(id, view) {
    const node = document.getElementById(id);
    if (node) node.replaceWith(view());
  }

  // only shown when the person has booked a desk and it isn't the signed in user
  async function loadDesks() {
    if (!person.email) return;
    const user = await currentUser();
    if (user.email && user.email.toLowerCase() === person.email.toLowerCase()) return;
    try {
      nearby = await callTool("desks_nearby", { email: person.email, limit: 5 }, "No desks nearby");
      if (nearby && nearby.desks && nearby.desks.length) renderDesks();
    } catch { /* they haven't booked a desk */ }
  }

  function deskName(desk) { return desk.name || desk.map_id || desk.id; }

  function renderDesks() {
    const section = document.getElementById("desks");
    if (!section || !nearby) return;
    const first = String(person.name || "").split(" ")[0] || "them";
    const tz = nearby.timezone;
    const level = nearby.level.display_name || nearby.level.name;
    section.replaceChildren(
      el("strong", {}, `Sit near ${first}`),
      el("div", { class: "muted" }, `${first} is at ${deskName(nearby.origin)}, ${level}, ${fmtDay(nearby.period_start, tz)} ${fmtTime(nearby.period_start, tz)} – ${fmtTime(nearby.period_end, tz)}`),
      el("ul", { class: "desks" }, nearby.desks.map((desk) => el("li", {},
        el("span", {}, deskName(desk), desk.features && desk.features.length ? el("span", { class: "muted" }, ` · ${desk.features.join(", ")}`) : null),
        el("button", { type: "button", onclick: (event) => bookDesk(desk, event.target) }, "Book")))),
    );
  }

  async function bookDesk(desk, button) {
    if (busy) return;
    busy = true;
    button.disabled = true;
    setStatus("Booking…");
    try {
      const first = String(person.name || "").split(" ")[0] || person.email;
      await callTool("bookings_book", { asset_id: desk.id, booking_type: "desk", booking_start: nearby.period_start, booking_end: nearby.period_end, title: `Desk near ${first}`, timezone: nearby.timezone }, "The desk couldn't be booked");
      const summary = `Booked ${deskName(desk)} near ${person.name || person.email}, ${fmtDay(nearby.period_start, nearby.timezone)} ${fmtTime(nearby.period_start, nearby.timezone)} – ${fmtTime(nearby.period_end, nearby.timezone)}.`;
      request("ui/update-model-context", { content: [{ type: "text", text: summary }] }).catch(() => {});
      nearby.desks = [];
      document.getElementById("desks").replaceChildren();
      setStatus(summary, "ok");
    } catch (error) {
      button.disabled = false;
      setStatus(error.message, "error");
    }
    busy = false;
  }

  // the photo comes back as an image content block
  async function loadPhoto() {
    try {
      const result = await request("tools/call", { name: "staff_photo", arguments: { id: person.email || person.id } });
      const image = result && !result.isError && result.content && result.content.find((item) => item.type === "image");
      if (image) {
        photo = `data:${image.mimeType};base64,${image.data}`;
        const avatar = document.getElementById("avatar");
        if (avatar) avatar.replaceWith(avatarView());
      }
    } catch { /* no photo, keep the initials */ }
  }

  function initials() {
    const words = String(person.name || person.email || "?").split(/[\s@.]+/).filter(Boolean);
    return words.slice(0, 2).map((word) => word[0].toUpperCase()).join("");
  }

  function avatarView() {
    const style = "width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover;";
    if (photo) return el("img", { id: "avatar", src: photo, alt: "", style });
    return el("div", { id: "avatar", style: `${style}display:grid;place-items:center;background:var(--chip);font-weight:600;font-size:20px;` }, initials());
  }

  function link(label, url) {
    return el("a", { href: url, onclick: (event) => { event.preventDefault(); openLink(url); } }, label);
  }

  function render() {
    const first = String(person.name || "").split(" ")[0] || "them";
    const at = nextQuarterHour();
    const starting = wallClock(at, localZone);
    const subtitle = [person.title, person.department].filter(Boolean).join(" · ");

    // replaceChildren, unlike el(), would show a null child as the text "null"
    app.replaceChildren(...[
      el("div", { class: "row", style: "gap:12px;flex-wrap:nowrap" },
        avatarView(),
        el("div", {},
          el("h1", {}, person.name || person.email),
          subtitle ? el("div", { class: "muted" }, subtitle) : null,
          person.office_location ? el("div", { class: "muted" }, person.office_location) : null)),
      el("dl", {},
        person.email ? [el("dt", {}, "Email"), el("dd", {}, link(person.email, `mailto:${person.email}`))] : null,
        person.phone ? [el("dt", {}, "Phone"), el("dd", {}, link(person.phone, `tel:${person.phone.replace(/[^\d+]/g, "")}`))] : null),
      person.email ? el("section", {},
        el("strong", {}, `Book a meeting with ${first}`),
        el("form", { id: "meeting", onsubmit: book },
          el("label", { class: "wide" }, "Title", el("input", { name: "title", required: true, value: `Meeting with ${first}`, maxlength: "200" })),
          el("label", { class: "wide" }, "Date", el("input", { name: "date", type: "date", required: true, value: starting.date, onchange: () => { loadSchedule(); timeChanged(); } })),
          availabilityView(),
          el("label", {}, "Start", el("input", { name: "start", type: "time", required: true, value: starting.time, step: "300", onchange: timeChanged })),
          el("label", {}, "Duration", el("select", { name: "duration", onchange: timeChanged },
            [15, 30, 45, 60, 90, 120].map((minutes) => el("option", { value: minutes, selected: minutes === 30 }, minutes < 60 ? `${minutes} min` : `${minutes / 60} hr`)))),
          el("div", { id: "time-note", class: "note", role: "status" }),
          el("label", { class: "check" }, el("input", { name: "room_wanted", type: "checkbox", onchange: () => { refresh("rooms", roomsView); loadRooms(); } }), "Add a room"),
          roomsView(),
          el("div", { class: "actions" }, el("button", { type: "submit", class: "primary", disabled: busy }, busy ? "Booking…" : "Book meeting")))) : null,
      el("section", { id: "desks" }),
      el("div", { id: "status", class: "status", role: "status" }),
    ].filter(Boolean));
    renderDesks();
  }

  async function book(submitted) {
    submitted.preventDefault();
    const form = submitted.target;
    const { start, end } = meetingTime();
    if (end <= Date.now() / 1000) return setStatus("That time has already passed", "error");

    // the room must be one found for this time
    const time = `${start}-${end}-`;
    const room = form.elements.room_wanted.checked ? form.elements.system_id && form.elements.system_id.value : null;
    if (form.elements.room_wanted.checked && (!room || !rooms || !rooms.key.startsWith(time))) {
      return setStatus("Pick a free room, or untick Add a room", "error");
    }
    const space = room ? rooms.spaces.find((item) => item.id === room) : null;

    busy = true;
    form.querySelector("button[type=submit]").disabled = true;
    setStatus("Booking…");
    try {
      const title = form.elements.title.value.trim();
      const args = { title, event_start: start, event_end: end, attendees: [person.email], timezone: localZone };
      if (room) args.system_id = room;
      await callTool("events_book", args, "The meeting couldn't be booked");
      const where = space ? ` in ${space.display_name || space.name}${space.approval ? " (pending approval)" : ""}` : "";
      const summary = `Booked "${title}" with ${person.name || person.email}${where}, ${fmtDay(start, localZone)} ${fmtTime(start, localZone)} – ${fmtTime(end, localZone)}.`;
      request("ui/update-model-context", { content: [{ type: "text", text: summary }] }).catch(() => {});
      setStatus(summary, "ok");
      // the calendars changed: show it
      schedule = null;
      rooms = null;
      loadSchedule();
      if (room) loadRooms();
    } catch (error) {
      setStatus(error.message, "error");
    }
    busy = false;
    form.querySelector("button[type=submit]").disabled = false;
  }

  start("placeos-staff-card");
})();
</script>
</body>
</html>
