<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting</title>
<!--
  The event card (MCP Apps), rendered for events_show and events_book. Shows a meeting with
  its room's photos (spaces_image) and level map (spaces_map), the host and attendees with
  their photos (staff_photo) and the online meeting. Its host (or the owner of the calendar
  it was read from) can edit it with events_edit or cancel it with events_destroy.
  Talks to the host with JSON-RPC over postMessage (ui/initialize, ui/notifications/tool-result,
  tools/call). Tool results are the {status, headers, body} envelope as structuredContent.
-->
<style>
/* kit:css */
/* Shared by every card, copied in by `npm run cards:kit` (scripts/sync-card-kit.mjs).
   Colours follow the host's theme variables (MCP Apps hostContext.styles) when it sends
   them, with our own light and dark values otherwise. */
:root {
  --bg: var(--color-background-primary, #ffffff);
  --surface: var(--color-background-secondary, #f5f6f8);
  --surface-2: var(--color-background-tertiary, #eaecf0);
  --fg: var(--color-text-primary, #1c1f24);
  --muted: var(--color-text-secondary, #5f6672);
  --line: var(--color-border-primary, #d9dde3);
  --line-soft: var(--color-border-secondary, #e8ebef);
  --danger: var(--color-text-danger, #c4314b);
  --accent: #3b5bdb; --accent-fg: #ffffff; --accent-soft: #e6ebfd; --accent-line: #8da2f0;
  --ok: #1d7a46; --ok-soft: #e2f3e9; --ok-fill: #3a9a63;
  --warn: #8a5300; --warn-soft: #fdf0d9; --warn-line: #e3a542; --warn-fill: #d08a2c;
  --busy: #b42318; --busy-fill: #c8513f;
  --overlay: rgba(20, 22, 26, 0.72); --overlay-fg: #ffffff;
  --radius: var(--border-radius-lg, 12px); --radius-sm: var(--border-radius-md, 8px);
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-family: var(--font);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-background-primary, #1b1d21); --surface: var(--color-background-secondary, #232529);
    --surface-2: var(--color-background-tertiary, #2c2f34); --fg: var(--color-text-primary, #eceef1);
    --muted: var(--color-text-secondary, #9aa1ab); --line: var(--color-border-primary, #383c43);
    --line-soft: var(--color-border-secondary, #2c3036); --danger: var(--color-text-danger, #f08396);
    --accent: #5b7cf0; --accent-soft: #263055; --accent-line: #7f97f2;
    --ok: #8fd6aa; --ok-soft: #1f3a2b; --ok-fill: #2f7a50;
    --warn: #f3c46e; --warn-soft: #3d2f17; --warn-line: #b8862f; --warn-fill: #c0812a;
    --busy: #f4a3a3; --busy-fill: #a8473a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #1b1d21); --surface: var(--color-background-secondary, #232529);
  --surface-2: var(--color-background-tertiary, #2c2f34); --fg: var(--color-text-primary, #eceef1);
  --muted: var(--color-text-secondary, #9aa1ab); --line: var(--color-border-primary, #383c43);
  --line-soft: var(--color-border-secondary, #2c3036); --danger: var(--color-text-danger, #f08396);
  --accent: #5b7cf0; --accent-soft: #263055; --accent-line: #7f97f2;
  --ok: #8fd6aa; --ok-soft: #1f3a2b; --ok-fill: #2f7a50;
  --warn: #f3c46e; --warn-soft: #3d2f17; --warn-line: #b8862f; --warn-fill: #c0812a;
  --busy: #f4a3a3; --busy-fill: #a8473a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.45; }
h1 { font-size: 22px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: 15px; margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
[hidden] { display: none !important; }

/* header: title, subtitle and status chips */
.head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.head .subtitle { color: var(--muted); margin-top: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--surface-2); color: var(--danger); }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* buttons and form controls */
button, .btn { font: inherit; font-size: 14px; border-radius: var(--radius-sm); padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; min-height: 36px; }
button:hover:not(:disabled), .btn:hover { background: var(--surface); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled), .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.primary.caution { background: var(--warn-fill); border-color: var(--warn-fill); }
button.danger { color: var(--danger); border-color: transparent; background: none; }
button.danger:hover:not(:disabled) { background: var(--surface); }
button.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; text-decoration: underline; }
button.link:hover:not(:disabled) { background: none; }
button:disabled { opacity: 0.55; cursor: default; }
button svg, .btn svg { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg); min-width: 0; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; width: 100%; min-height: 38px; }
textarea { resize: vertical; min-height: 64px; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; margin: 0; accent-color: var(--accent); }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
label.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }

/* sections and the footer action bar */
section { margin-top: 20px; }
section > h2 { margin-bottom: 10px; }
.divider { border: 0; border-top: 1px solid var(--line-soft); margin: 20px 0; }
.footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); margin-top: 24px; padding-top: 16px; }
.footer .summary { flex: 1; min-width: 160px; color: var(--muted); }
.footer .end { margin-left: auto; }
.status { min-height: 1.4em; margin-top: 10px; }
.status:empty { display: none; }
.status.error { color: var(--danger); }
.status.ok { color: var(--ok); }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 12px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
.banner .grow { min-width: 180px; }
.banner button { border-color: currentColor; color: inherit; background: none; font-weight: 600; }

/* label / value details */
.details { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px 16px; margin: 20px 0 0; }
.details dt { color: var(--muted); padding-top: 2px; }
.details dd { margin: 0; overflow-wrap: anywhere; }
.details .chips { margin-top: 8px; }

/* people: an avatar with photo or initials, name and a muted line */
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; overflow: hidden; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.avatar.large { width: 64px; height: 64px; font-size: 22px; }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person .who { min-width: 0; }
.person .name { font-weight: 500; overflow-wrap: anywhere; }
.person .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; list-style: none; margin: 0; padding: 0; }
.response { font-size: 12px; }
.response.accepted { color: var(--ok); }
.response.declined { color: var(--danger); }

/* selectable tiles, i.e. rooms, desks and search results */
/* --tile-min: wider for tiles holding a button or an avatar */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min, 190px), 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; }
.tile { display: grid; gap: 4px; text-align: left; align-content: start; justify-content: stretch; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); width: 100%; height: 100%; min-height: 0; }
.tile .title { font-weight: 600; overflow-wrap: anywhere; }
.tile .sub { color: var(--muted); font-size: 13px; }
.tile .free { color: var(--ok); font-size: 13px; }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.tile.person-tile { grid-template-columns: auto 1fr; align-items: center; gap: 10px; }

/* media: the photos and the level map, side by side on wide cards */
.media { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.media > .solo { grid-column: 1 / -1; }
.panel { position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); border: 1px solid var(--line-soft); }
.media > .solo.panel { aspect-ratio: 21 / 9; }
/* a map on its own: wide enough to find the room or desk, without taking the whole card */
.media > .solo.map { aspect-ratio: auto; height: min(320px, 40vw); }
.panel .caption { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); background: var(--overlay); color: var(--overlay-fg); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 13px; pointer-events: none; }
.panel .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.carousel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.carousel .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; border: 0; background: var(--overlay); color: var(--overlay-fg); font-size: 18px; }
.carousel .nav:hover:not(:disabled) { background: var(--overlay); filter: brightness(1.3); }
.carousel .prev { left: 10px; }
.carousel .next { right: 10px; }
.carousel .dots { position: absolute; right: 12px; bottom: 14px; display: flex; gap: 6px; }
.carousel .dots button { width: 8px; height: 8px; min-height: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
.carousel .dots button[aria-current="true"] { background: #ffffff; }
.map { touch-action: none; cursor: grab; user-select: none; }
.map.dragging { cursor: grabbing; }
.map .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.map .canvas img { width: 100%; height: 100%; display: block; pointer-events: none; }
.map .pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--accent); border: 3px solid #ffffff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent), 0 1px 4px rgba(0, 0, 0, 0.4); }
.map .controls { position: absolute; top: 10px; right: 10px; display: grid; border-radius: var(--radius-sm); overflow: hidden; background: var(--overlay); }
.map .controls button { width: 36px; height: 36px; min-height: 0; padding: 0; border: 0; border-radius: 0; background: none; color: var(--overlay-fg); }
.map .controls button + button { border-top: 1px solid rgba(255, 255, 255, 0.18); }
.map .controls button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
.map-toggle { display: none; }

/* a day's availability as a bar, with the chosen time outlined */
.timeline { margin-top: 6px; }
.timeline .legend { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.timeline .legend span { display: inline-flex; align-items: center; gap: 6px; }
.timeline .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.timeline .bar { position: relative; height: 44px; border-radius: var(--radius-sm); background: var(--ok-fill); overflow: hidden; cursor: pointer; margin-top: 8px; }
.timeline .bar.loading { background: var(--surface-2); cursor: default; }
.timeline .seg { position: absolute; top: 0; bottom: 0; }
.kind-free { background: var(--ok-fill); }
.kind-me { background: repeating-linear-gradient(135deg, var(--warn-fill) 0 6px, color-mix(in srgb, var(--warn-fill) 55%, transparent) 6px 12px); }
.kind-them { background: repeating-linear-gradient(135deg, var(--busy-fill) 0 6px, color-mix(in srgb, var(--busy-fill) 55%, transparent) 6px 12px); }
.kind-both, .kind-busy { background: var(--busy-fill); }
.kind-past { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.timeline .legend i.kind-past { background: color-mix(in srgb, var(--surface-2) 70%, var(--ok-fill)); }
.timeline .selected { position: absolute; top: 3px; bottom: 3px; border: 2px solid #ffffff; border-radius: 6px; box-shadow: 0 0 0 2px var(--accent); pointer-events: none; min-width: 6px; }
.timeline .ticks { position: relative; height: 18px; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.timeline .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.timeline .ticks span:first-child { transform: none; }

@media (max-width: 639px) {
  body { padding: 16px; }
  h1 { font-size: 20px; }
  .head { flex-direction: column; gap: 8px; }
  .media { grid-template-columns: minmax(0, 1fr); }
  .media > .solo.panel, .panel { aspect-ratio: 16 / 10; height: auto; }
  .media .map:not(.open) { display: none; }
  .map-toggle { display: inline-flex; justify-self: start; }
  .details { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .details dd { margin-bottom: 10px; }
  .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fields .first { grid-column: 1 / -1; }
  button, .btn, input, select { min-height: 44px; }
  .carousel .dots button, .map .controls button, button.link { min-height: 0; }
  .timeline .ticks span:nth-child(even) { display: none; }
}
/* /kit:css */
  .where-name { font-weight: 600; }
  .online { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .online code { font-family: var(--font-mono, ui-monospace, monospace); color: var(--muted); }
  .more { margin-top: 10px; }
  .confirm { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
  .confirm .grow { min-width: 200px; }
  form.edit { margin-top: 20px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
  // kit:js
  // Shared by every card, copied in by `npm run cards:kit` (scripts/sync-card-kit.mjs).

  // ---- host bridge: JSON-RPC over postMessage (MCP Apps) ----
  const app = document.getElementById("app");
  let nextId = 1;
  const pending = new Map();
  const hooks = { input: () => {}, result: () => {} };

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "request failed")) : resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-input": hooks.input((msg.params && msg.params.arguments) || {}); break;
      case "ui/notifications/tool-result": hooks.result(msg.params); break;
      case "ui/notifications/host-context-changed": applyContext(msg.params); break;
      case "ui/resource-teardown": send({ jsonrpc: "2.0", id: msg.id, result: {} }); break;
      default:
        // answer unknown requests so the host isn't left waiting
        if (msg.id !== undefined && msg.method) send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "method not found" } });
    }
  });

  // the host's theme and, when it sends them, its colours and fonts
  function applyContext(context) {
    if (!context) return;
    if (context.theme) document.documentElement.dataset.theme = context.theme;
    const variables = context.styles && context.styles.variables;
    if (variables) for (const [name, value] of Object.entries(variables)) if (value) document.documentElement.style.setProperty(name, value);
  }

  // connects to the host, `onInput` gets the tool's arguments and `onResult` its result
  function start(name, { onInput, onResult }) {
    if (onInput) hooks.input = onInput;
    hooks.result = onResult;
    request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name, version: "2.0.0" },
      appCapabilities: {},
    }).then((result) => {
      applyContext(result && result.hostContext);
      notify("ui/notifications/initialized", {});
    }).catch(() => notify("ui/notifications/initialized", {}));
  }

  // keep the host's frame the size of the content
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }).observe(document.body);

  // a tool result's {status, headers, body} envelope
  function envelope(result) {
    const content = result && result.structuredContent;
    if (content && typeof content.status === "number") return content;
    const text = result && result.content && result.content.find((item) => item.type === "text");
    try { return text ? JSON.parse(text.text) : null; } catch { return null; }
  }

  function errorText(response, fallback) {
    const body = response && response.body;
    const detail = body && (typeof body === "string" ? body : body.message || body.error);
    return detail ? `${fallback}: ${detail}` : fallback;
  }

  // calls a tool, returning the response body or throwing the error
  async function callTool(name, args, failure) {
    const result = await request("tools/call", { name, arguments: args });
    const response = envelope(result);
    if ((result && result.isError) || !response || response.status >= 400) throw new Error(errorText(response, failure));
    return response.body;
  }

  // calls a tool that returns an image: {src, headers} with lower case header names, or null
  async function callImage(name, args) {
    try {
      const result = await request("tools/call", { name, arguments: args });
      const image = result && !result.isError && result.content && result.content.find((item) => item.type === "image");
      if (!image) return null;
      const response = envelope(result) || {};
      const headers = Object.fromEntries(Object.entries(response.headers || {}).map(([key, value]) => [key.toLowerCase(), value]));
      return { src: `data:${image.mimeType};base64,${image.data}`, headers };
    } catch { return null; }
  }

  // tells the model what the user did in the card, hosts without support reject it
  function tellModel(text) {
    request("ui/update-model-context", { content: [{ type: "text", text }] }).catch(() => {});
  }

  // opens a link through the host, or itself when the host refuses (some only open web links)
  function openLink(url) {
    const fallback = () => window.open(url, "_blank", "noopener");
    request("ui/open-link", { url }).then((result) => { if (result && result.isError) fallback(); }).catch(fallback);
  }

  // the signed in user, for deciding which actions to offer
  let me = null;
  function currentUser() {
    me = me || callTool("users_current", {}, "Unable to load your details").catch(() => ({}));
    return me;
  }

  // ---- DOM ----
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child);
    return node;
  }

  // replaces the children, skipping empty ones (null would show as the text "null")
  function fill(node, ...children) {
    node.replaceChildren(...children.flat(Infinity).filter((child) => child !== null && child !== undefined && child !== false));
    return node;
  }

  // replaces the element with this id by a fresh render of it
  function refresh(id, view) {
    const node = document.getElementById(id);
    if (node) node.replaceWith(view());
  }

  const ICONS = {
    mail: '<path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7"/>',
    phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    locate: '<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
    map: '<path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
    video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
  };
  function icon(name) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = ICONS[name] || "";
    return svg;
  }

  const lower = (value) => String(value || "").trim().toLowerCase();
  const narrow = () => window.matchMedia("(max-width: 639px)").matches;

  // ---- time: epochs shown and entered in an IANA timezone ----
  const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function zoneOf(tz) { try { new Intl.DateTimeFormat(undefined, { timeZone: tz }); return tz || localZone; } catch { return localZone; } }
  const format = (epoch, tz, options) => new Intl.DateTimeFormat(undefined, { ...options, timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  const fmtTime = (epoch, tz) => format(epoch, tz, { hour: "numeric", minute: "2-digit" });
  const fmtHour = (epoch, tz) => format(epoch, tz, { hour: "numeric" });
  // "Today, Tue 13 Oct", "Tomorrow, …" or "Thu 15 Oct", with the year when it isn't this year
  function fmtDay(epoch, tz) {
    const date = wallClock(epoch, tz).date;
    const today = wallClock(Date.now() / 1000, tz).date;
    const options = { weekday: "short", day: "numeric", month: "short" };
    if (date.slice(0, 4) !== today.slice(0, 4)) options.year = "numeric";
    const day = format(epoch, tz, options);
    if (date === today) return `Today, ${day}`;
    if (date === nextDay(today)) return `Tomorrow, ${day}`;
    return day;
  }
  // the zone's short name, i.e. "AEDT", when it's not the viewer's own zone
  function zoneName(epoch, tz) {
    const part = new Intl.DateTimeFormat(undefined, { timeZoneName: "short", timeZone: zoneOf(tz) }).formatToParts(new Date(epoch * 1000)).find((item) => item.type === "timeZoneName");
    return part ? part.value : "";
  }
  // "4:00 – 4:30 pm", the locale's way of writing a range of times
  function fmtTimes(start, end, tz) {
    const formatter = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: zoneOf(tz) });
    return formatter.formatRange ? formatter.formatRange(new Date(start * 1000), new Date(end * 1000)) : `${fmtTime(start, tz)} – ${fmtTime(end, tz)}`;
  }
  // "Today, Tue 13 Oct · 4:00 – 4:30 pm AEDT"
  function fmtRange(start, end, tz, withZone = true) {
    const sameDay = wallClock(start, tz).date === wallClock(end - 1, tz).date;
    const times = sameDay ? fmtTimes(start, end, tz) : `${fmtTime(start, tz)} – ${fmtDay(end, tz)} ${fmtTime(end, tz)}`;
    return `${fmtDay(start, tz)} · ${times}${withZone ? ` ${zoneName(start, tz)}` : ""}`;
  }
  // {date: "YYYY-MM-DD", time: "HH:MM"} of an epoch in a timezone
  function wallClock(epoch, tz) {
    const parts = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: zoneOf(tz) }).formatToParts(new Date(epoch * 1000));
    const part = (type) => parts.find((item) => item.type === type).value;
    return { date: `${part("year")}-${part("month")}-${part("day")}`, time: `${part("hour")}:${part("minute")}` };
  }
  // the epoch of a date and time in a timezone
  function zonedEpoch(date, time, tz) {
    const [y, m, d] = date.split("-").map(Number);
    const [h, mi] = time.split(":").map(Number);
    const target = Date.UTC(y, m - 1, d, h, mi) / 1000;
    let epoch = target;
    for (let i = 0; i < 2; i++) {
      const wall = wallClock(epoch, tz);
      const [wy, wm, wd] = wall.date.split("-").map(Number);
      const [wh, wmi] = wall.time.split(":").map(Number);
      epoch += target - Date.UTC(wy, wm - 1, wd, wh, wmi) / 1000;
    }
    return epoch;
  }
  // the date (YYYY-MM-DD) some days after another
  function addDays(date, days) {
    const [y, m, d] = date.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
  }
  const nextDay = (date) => addDays(date, 1);
  const prevDay = (date) => addDays(date, -1);
  const nextQuarterHour = () => Math.ceil(Date.now() / 900000) * 900;

  // ---- people: avatars with a photo (staff_photo) or initials ----
  const photos = new Map();
  let photoSlots = 3;
  const photoQueue = [];
  function photoOf(email) {
    const key = lower(email);
    if (!key) return Promise.resolve(null);
    if (!photos.has(key)) {
      photos.set(key, new Promise((resolve) => photoQueue.push({ key, resolve })));
      pumpPhotos();
    }
    return photos.get(key);
  }
  // at most three photo requests at a time
  function pumpPhotos() {
    while (photoSlots > 0 && photoQueue.length) {
      const { key, resolve } = photoQueue.shift();
      photoSlots--;
      callImage("staff_photo", { id: key }).then((image) => resolve(image && image.src)).finally(() => { photoSlots++; pumpPhotos(); });
    }
  }

  function initials(person) {
    const name = String((person && (person.name || person.email)) || "?").replace(/@.*/, "");
    const words = name.split(/[\s._-]+/).filter(Boolean);
    return words.slice(0, 2).map((word) => word[0].toUpperCase()).join("") || "?";
  }

  // an avatar showing the initials until the photo loads, `photo: false` skips the photo
  function avatar(person, { large = false, photo = true } = {}) {
    const node = el("span", { class: large ? "avatar large" : "avatar", "aria-hidden": "true" }, initials(person));
    if (photo && person && person.email) {
      photoOf(person.email).then((src) => { if (src) node.append(el("img", { src, alt: "" })); });
    }
    return node;
  }

  function personRow(person, sub, extra) {
    return el("div", { class: "person" }, avatar(person),
      el("div", { class: "who" },
        el("div", { class: "name" }, person.name || person.email),
        sub || extra ? el("div", { class: "sub" }, sub, extra) : null));
  }

  // ---- media: photos and the level map ----
  // images: {count, load(index) → Promise(src | null), caption}
  // map: {load() → Promise({src, x, y, box} | null), caption}
  function mediaRow({ images, map }) {
    const hasImages = images && images.count > 0;
    const row = el("div", { class: "media" });
    const photosPanel = hasImages ? carousel(images) : null;
    let toggle = null;
    // a room or desk that isn't drawn on a map leaves the photos on their own
    const missing = () => {
      mapPanel.remove();
      if (toggle) toggle.remove();
      if (photosPanel) photosPanel.classList.add("solo");
      else row.remove();
    };
    const mapPanel = map ? mapViewer({ ...map, missing }) : null;
    if (photosPanel && !mapPanel) photosPanel.classList.add("solo");
    if (mapPanel && !photosPanel) mapPanel.classList.add("solo", "open");
    fill(row, photosPanel, mapPanel);
    if (mapPanel && photosPanel) {
      // narrow cards show the map under the photos once asked for, loading it then
      toggle = el("button", { type: "button", class: "map-toggle", "aria-expanded": "false" }, icon("map"), "Show map");
      toggle.addEventListener("click", () => {
        const open = !mapPanel.classList.contains("open");
        mapPanel.classList.toggle("open", open);
        toggle.setAttribute("aria-expanded", String(open));
        toggle.lastChild.textContent = open ? "Hide map" : "Show map";
        if (open) mapPanel.load();
      });
      row.append(toggle);
      if (!narrow()) mapPanel.load();
    } else if (mapPanel) {
      mapPanel.load();
    }
    if (!photosPanel && !mapPanel) return null;
    return row;
  }

  function carousel({ count, load, caption }) {
    const loaded = new Map();
    let index = 0;
    const panel = el("div", { class: "panel carousel", role: "group", "aria-label": "Photos" });
    const show = (next) => {
      index = (next + count) % count;
      render();
      if (!loaded.has(index)) {
        const wanted = index;
        loaded.set(wanted, null);
        load(wanted).then((src) => { loaded.set(wanted, src || "error"); if (index === wanted) render(); });
      }
    };
    const render = () => {
      const src = loaded.get(index);
      fill(panel,
        src && src !== "error" ? el("img", { src, alt: `Photo ${index + 1} of ${count}` }) : el("div", { class: "placeholder" }, src === "error" ? "Photo unavailable" : "Loading photo…"),
        caption ? el("div", { class: "caption" }, caption) : null,
        count > 1 ? [
          el("button", { type: "button", class: "nav prev", "aria-label": "Previous photo", onclick: () => show(index - 1) }, "‹"),
          el("button", { type: "button", class: "nav next", "aria-label": "Next photo", onclick: () => show(index + 1) }, "›"),
          el("div", { class: "dots" }, Array.from({ length: count }, (_, dot) =>
            el("button", { type: "button", "aria-label": `Photo ${dot + 1}`, "aria-current": String(dot === index), onclick: () => show(dot) }))),
        ] : null);
    };
    show(0);
    return panel;
  }

  // the level map with a pin, zoomed with the buttons, ctrl + wheel or a pinch, dragged to pan
  function mapViewer({ load, caption, missing }) {
    const panel = el("div", { class: "panel map", role: "group", "aria-label": "Level map" });
    const canvas = el("div", { class: "canvas" });
    let map = null;
    let view = { scale: 1, x: 0, y: 0 };
    let base = { width: 0, height: 0 };
    let started = false;
    const MIN = 1;
    const MAX = 8;

    fill(panel, el("div", { class: "placeholder" }, "Loading map…"));

    // the map's size at scale 1, contained in the panel
    function measure() {
      const width = panel.clientWidth;
      const height = panel.clientHeight;
      const ratio = map.box[2] / map.box[3];
      base = width / height > ratio ? { width: height * ratio, height } : { width, height: width / ratio };
      canvas.style.width = `${base.width}px`;
      canvas.style.height = `${base.height}px`;
    }
    function clamp() {
      const width = panel.clientWidth;
      const height = panel.clientHeight;
      view.scale = Math.min(MAX, Math.max(MIN, view.scale));
      const w = base.width * view.scale;
      const h = base.height * view.scale;
      view.x = w <= width ? (width - w) / 2 : Math.min(0, Math.max(width - w, view.x));
      view.y = h <= height ? (height - h) / 2 : Math.min(0, Math.max(height - h, view.y));
      canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
      panel.dataset.scale = view.scale.toFixed(2);
    }
    // zoom around a point of the panel
    function zoom(factor, cx = panel.clientWidth / 2, cy = panel.clientHeight / 2) {
      const scale = Math.min(MAX, Math.max(MIN, view.scale * factor));
      view.x = cx - ((cx - view.x) * scale) / view.scale;
      view.y = cy - ((cy - view.y) * scale) / view.scale;
      view.scale = scale;
      clamp();
    }
    // the pin in the middle, zoomed in a little
    function recenter() {
      measure();
      view.scale = 2;
      const px = ((map.x - map.box[0]) / map.box[2]) * base.width * view.scale;
      const py = ((map.y - map.box[1]) / map.box[3]) * base.height * view.scale;
      view.x = panel.clientWidth / 2 - px;
      view.y = panel.clientHeight / 2 - py;
      clamp();
    }

    function show() {
      const [minX, minY, width, height] = map.box;
      const pin = el("div", { class: "pin", style: `left:${((map.x - minX) / width) * 100}%;top:${((map.y - minY) / height) * 100}%` });
      // the SVG is shown as an image, so nothing in it can run
      fill(canvas, el("img", { src: map.src, alt: "", onload: recenter }), pin);
      fill(panel, canvas,
        el("div", { class: "controls" },
          el("button", { type: "button", "aria-label": "Zoom in", title: "Zoom in", onclick: () => zoom(1.5) }, icon("plus")),
          el("button", { type: "button", "aria-label": "Zoom out", title: "Zoom out", onclick: () => zoom(1 / 1.5) }, icon("minus")),
          el("button", { type: "button", "aria-label": "Recenter", title: "Recenter", onclick: recenter }, icon("locate"))),
        caption || map.location ? el("div", { class: "caption" }, caption || map.location) : null);
      new ResizeObserver(() => { if (panel.clientWidth) { measure(); clamp(); } }).observe(panel);
    }

    // dragging with one pointer, pinching with two
    const pointers = new Map();
    let pinch = null;
    panel.addEventListener("pointerdown", (event) => {
      if (!map || event.target.closest(".controls")) return;
      panel.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      panel.classList.add("dragging");
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = Math.hypot(a.x - b.x, a.y - b.y);
      }
    });
    panel.addEventListener("pointermove", (event) => {
      const last = pointers.get(event.pointerId);
      if (!last) return;
      const point = { x: event.clientX, y: event.clientY };
      pointers.set(event.pointerId, point);
      if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        const distance = Math.hypot(a.x - b.x, a.y - b.y);
        const rect = panel.getBoundingClientRect();
        zoom(distance / pinch, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
        pinch = distance;
      } else if (pointers.size === 1) {
        view.x += point.x - last.x;
        view.y += point.y - last.y;
        clamp();
      }
    });
    const release = (event) => {
      pointers.delete(event.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) panel.classList.remove("dragging");
    };
    panel.addEventListener("pointerup", release);
    panel.addEventListener("pointercancel", release);
    // trackpad pinches arrive as ctrl + wheel, a plain wheel keeps scrolling the page
    panel.addEventListener("wheel", (event) => {
      if (!map || !event.ctrlKey) return;
      event.preventDefault();
      const rect = panel.getBoundingClientRect();
      zoom(Math.exp(-event.deltaY / 200), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });

    panel.load = () => {
      if (started) return;
      started = true;
      load().then((found) => {
        if (!found) return missing ? missing() : fill(panel, el("div", { class: "placeholder" }, "Map unavailable"));
        map = found;
        show();
      });
    };
    return panel;
  }

  // a map tool's image as the viewer's {src, x, y, box, location}, or null when it isn't
  // drawn on one. location is "Level 1 · Building", from the X-Map-Location header
  async function loadMap(tool, args) {
    const image = await callImage(tool, args);
    if (!image) return null;
    const pin = String(image.headers["x-map-pin"] || "").split(",").map(Number);
    const box = String(image.headers["x-map-view-box"] || "").split(/[\s,]+/).map(Number);
    if (pin.length !== 2 || box.length !== 4 || !(box[2] > 0 && box[3] > 0)) return null;
    let location = "";
    try { location = decodeURIComponent(image.headers["x-map-location"] || ""); } catch { /* left out */ }
    return { src: image.src, x: pin[0], y: pin[1], box, location };
  }

  // ---- a day's availability as a bar ----
  // segments: [{start, end, kind}] with kind free, me, them, both, busy or past;
  // legend: [[kind, label]]; selected: {start, end}; onPick(epoch) when a spot is clicked
  function timeline({ id, from, to, tz, segments, selected, legend, title, loading, onPick }) {
    const span = to - from;
    const pct = (epoch) => `${((Math.min(Math.max(epoch, from), to) - from) / span) * 100}%`;
    const bar = el("div", { class: loading ? "bar loading" : "bar", role: "img", "aria-label": title || "Availability" });
    if (!loading) {
      for (const segment of segments) {
        if (segment.end <= from || segment.start >= to || segment.kind === "free") continue;
        bar.append(el("div", { class: `seg kind-${segment.kind}`, style: `left:${pct(segment.start)};width:calc(${pct(segment.end)} - ${pct(segment.start)})`, title: segment.label || "" }));
      }
      if (selected && selected.end > from && selected.start < to) {
        bar.append(el("div", { class: "selected", style: `left:${pct(selected.start)};width:calc(${pct(selected.end)} - ${pct(selected.start)})` }));
      }
      if (onPick) {
        bar.addEventListener("click", (event) => {
          const rect = bar.getBoundingClientRect();
          const epoch = from + ((event.clientX - rect.left) / rect.width) * span;
          onPick(Math.floor(epoch / 900) * 900);
        });
      }
    }
    const ticks = el("div", { class: "ticks", "aria-hidden": "true" });
    for (let tick = from; tick < to; tick += 7200) ticks.append(el("span", { style: `left:${pct(tick)}` }, fmtHour(tick, tz)));
    return el("div", { class: "timeline", id },
      el("div", { class: "row", style: "justify-content:space-between" },
        title ? el("strong", { style: "font-size:13px" }, title) : null,
        legend ? el("div", { class: "legend" }, legend.map(([kind, label]) => el("span", {}, el("i", { class: `kind-${kind}` }), label))) : null),
      bar, ticks);
  }

  // the busy segments merged into who's busy when: me, them or both
  function overlay(mine, theirs) {
    const points = [...new Set([...mine, ...theirs].flatMap((period) => [period.start, period.end]))].sort((a, b) => a - b);
    const busy = (list, start, end) => list.some((period) => period.start < end && period.end > start);
    const segments = [];
    for (let i = 0; i < points.length - 1; i++) {
      const [start, end] = [points[i], points[i + 1]];
      const me = busy(mine, start, end);
      const them = busy(theirs, start, end);
      if (!me && !them) continue;
      const kind = me && them ? "both" : me ? "me" : "them";
      const last = segments[segments.length - 1];
      if (last && last.kind === kind && last.end === start) last.end = end;
      else segments.push({ start, end, kind });
    }
    return segments;
  }
  // /kit:js

  // ---- the event card: shows a meeting, its host can edit or cancel it ----
  let event = null;
  let toolInput = {};
  let mode = "view"; // view | edit | confirm-cancel
  let busy = false;
  let showAll = false;
  let user = {};
  const PEOPLE_SHOWN = 8;

  const RESPONSES = {
    accepted: ["Accepted", "accepted"],
    declined: ["Declined", "declined"],
    tentative: ["Tentative", ""],
    tentativelyaccepted: ["Tentative", ""],
    needsaction: ["Not responded", ""],
    none: ["Not responded", ""],
  };

  function showResult(result) {
    const response = envelope(result);
    if (!response || response.status >= 400 || !response.body || !response.body.event_start) {
      fill(app, el("p", { class: "status error" }, errorText(response, "Unable to load the meeting")));
      return;
    }
    event = response.body;
    mode = "view";
    media = null;
    currentUser().then((found) => { user = found || {}; render(); });
  }

  const room = () => event.system || null;
  const roomName = () => room() ? room().display_name || room().name : "";
  const tz = () => event.timezone || localZone;
  const ending = () => event.event_end || event.event_start + 3600;
  const cancelled = () => lower(event.status) === "cancelled";

  // the room the meeting is in, and where it was read from
  const systemId = () => (room() && room().id) || event.system_id || toolInput.system_id;
  const calendar = () => toolInput.calendar || (systemId() ? undefined : event.calendar);

  // the arguments that find this meeting in tool calls
  function target() {
    const args = { id: event.id };
    if (systemId()) args.system_id = systemId();
    if (calendar()) args.calendar = calendar();
    return args;
  }

  function isHost() {
    const email = lower(user.email);
    return !!email && (lower(event.host) === email || lower(event.calendar) === email);
  }
  const editable = () => isHost() && ending() > Date.now() / 1000 && !cancelled();

  const attendees = () => (event.attendees || []).filter((attendee) => !attendee.resource);
  const guests = () => attendees().filter((attendee) => lower(attendee.email) !== lower(event.host));
  const host = () => attendees().find((attendee) => lower(attendee.email) === lower(event.host)) || (event.host ? { email: event.host } : null);
  const roomAttendee = () => (event.attendees || []).find((attendee) => attendee.resource && room() && lower(attendee.email) === lower(room().email));

  // ---- the room's photos and level map, kept across re-renders so the edit form doesn't reload them ----
  let media = null;
  function mediaView() {
    if (!room()) return null;
    if (media && media.room === room().id) return media.node;
    const space = room();
    const seats = space.capacity ? ` · ${space.capacity} seats` : "";
    media = { room: space.id, map: null };
    media.node = mediaRow({
      images: { count: (space.images || []).length, caption: `${roomName()}${seats}`, load: (index) => callImage("spaces_image", { id: space.id, index }).then((image) => image && image.src) },
      map: {
        load: () => {
          media.map = media.map || loadMap("spaces_map", { id: space.id });
          media.map.then(showLocation);
          return media.map;
        },
      },
    });
    return media.node;
  }

  // the room's level and building, from its map
  function showLocation(map) {
    const node = document.getElementById("where-location");
    if (node && map && map.location) node.textContent = ` · ${map.location}`;
  }

  function statusChips() {
    const chips = [];
    if (cancelled()) chips.push(el("li", { class: "chip danger" }, "Cancelled"));
    else if (lower(event.status) === "tentative") chips.push(el("li", { class: "chip warn dot" }, "Tentative"));
    else chips.push(el("li", { class: "chip ok dot" }, "Confirmed"));
    const resource = roomAttendee();
    if (room() && resource && !cancelled()) {
      const response = lower(resource.response_status);
      if (response === "accepted") chips.push(el("li", { class: "chip" }, "Room accepted"));
      else if (response === "declined") chips.push(el("li", { class: "chip danger" }, "Room declined"));
      else chips.push(el("li", { class: "chip warn" }, room().approval ? "Pending approval" : "Room pending"));
    }
    return el("ul", { class: "chips", "aria-label": "Status" }, chips);
  }

  function header() {
    const when = event.all_day ? `${fmtDay(event.event_start, tz())} · all day` : fmtRange(event.event_start, ending(), tz());
    return el("div", { class: "head" },
      el("div", { class: "grow" },
        el("h1", {}, event.title || (event.private ? "Private meeting" : "Untitled meeting")),
        el("div", { class: "subtitle" }, when)),
      statusChips());
  }

  function response(attendee) {
    const [label, kind] = RESPONSES[lower(attendee.response_status).replace(/[^a-z]/g, "")] || ["", ""];
    return label ? el("span", { class: `response ${kind}` }, ` · ${label}`) : null;
  }

  function details() {
    const space = room();
    const features = space ? [space.capacity ? `${space.capacity} seats` : null, ...(space.features || [])].filter(Boolean) : [];
    const list = guests();
    const shown = showAll ? list : list.slice(0, PEOPLE_SHOWN);
    const where = space
      ? [el("span", { class: "where-name" }, roomName()), el("span", { class: "muted", id: "where-location" }), features.length ? el("ul", { class: "chips" }, features.map((feature) => el("li", { class: "chip" }, feature))) : null]
      : event.location;
    const owner = host();
    return el("dl", { class: "details" },
      where ? [el("dt", {}, "Where"), el("dd", {}, where)] : null,
      owner ? [el("dt", {}, "Host"), el("dd", {}, personRow(owner, owner.name ? owner.email : "Organiser"))] : null,
      el("dt", {}, "Attendees"),
      el("dd", {},
        list.length
          ? el("ul", { class: "people", "aria-label": "Attendees" }, shown.map((attendee) => el("li", {}, personRow(attendee, attendee.name && attendee.name !== attendee.email ? attendee.email : "", response(attendee)))))
          : el("div", {}, "No other guests", el("span", { class: "muted" }, " · host only")),
        list.length > shown.length ? el("button", { type: "button", class: "link more", onclick: () => { showAll = true; render(); } }, `+${list.length - shown.length} more`) : null,
        editable() ? el("div", { class: "more" }, el("button", { type: "button", class: "link", onclick: () => edit("attendees") }, "+ Add people")) : null),
      event.online_meeting_url || event.online_meeting_id ? [el("dt", {}, "Online"), el("dd", { class: "online" },
        el("span", {}, event.online_meeting_provider || "Online meeting"),
        event.online_meeting_id ? el("code", {}, `ID ${event.online_meeting_id}`) : null,
        el("button", { type: "button", onclick: copyDetails }, icon("copy"), "Copy details"))] : null);
  }

  function footer() {
    if (mode === "confirm-cancel") {
      return el("div", { class: "footer" }, el("div", { class: "confirm" },
        el("span", { class: "grow" }, "Cancel this meeting and notify the attendees?"),
        el("button", { type: "button", class: "primary caution", disabled: busy, onclick: cancelEvent }, busy ? "Cancelling…" : "Yes, cancel it"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Keep it")));
    }
    const join = event.online_meeting_url && !cancelled() && ending() > Date.now() / 1000;
    if (!join && !editable()) return null;
    return el("div", { class: "footer" },
      join ? el("button", { type: "button", class: "primary", onclick: () => openLink(event.online_meeting_url) }, icon("video"), `Join ${providerName()}`) : null,
      editable() ? el("button", { type: "button", onclick: () => edit() }, "Edit") : null,
      editable() ? el("button", { type: "button", class: "danger end", onclick: () => { mode = "confirm-cancel"; render(); } }, "Cancel meeting") : null);
  }

  function providerName() {
    const provider = lower(event.online_meeting_provider);
    if (provider.includes("teams")) return "Teams";
    if (provider.includes("meet") || provider.includes("hangout")) return "Meet";
    if (provider.includes("zoom")) return "Zoom";
    if (provider.includes("webex")) return "Webex";
    return "online";
  }

  function render(message, kind) {
    fill(app,
      header(),
      mediaView(),
      mode === "edit" ? editForm() : details(),
      el("div", { id: "status", class: `status ${kind || ""}`, role: "status" }, message || ""),
      mode === "edit" ? null : footer());
    if (media && media.map) media.map.then(showLocation);
  }

  function setStatus(text, kind = "") {
    const status = document.getElementById("status");
    if (status) { status.textContent = text; status.className = `status ${kind}`; }
  }

  async function copyDetails() {
    const text = [
      event.title,
      event.online_meeting_url ? `Join: ${event.online_meeting_url}` : null,
      event.online_meeting_id ? `Meeting ID: ${event.online_meeting_id}` : null,
      event.online_meeting_pin ? `Passcode: ${event.online_meeting_pin}` : null,
      ...(event.online_meeting_phones || []).map((phone) => `Dial in: ${phone}`),
    ].filter(Boolean).join("\n");
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // sandboxed frames can't always use the clipboard API
      const area = el("textarea", { style: "position:fixed;opacity:0" }, text);
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    setStatus("Meeting details copied", "ok");
  }

  function edit(focus) {
    mode = "edit";
    render();
    const form = document.getElementById("edit");
    const field = form && form.elements[focus || "title"];
    if (field) field.focus();
  }

  function editForm() {
    const starting = wallClock(event.event_start, tz());
    const ended = wallClock(ending(), tz());
    const emails = guests().map((attendee) => attendee.email);
    return el("form", { id: "edit", class: "edit", onsubmit: save },
      el("div", { class: "fields" },
        el("label", { class: "field wide" }, "Title", el("input", { name: "title", required: true, value: event.title || "", maxlength: "200" })),
        el("label", { class: "field first" }, "Date", el("input", { name: "date", type: "date", required: true, value: starting.date })),
        el("label", { class: "field" }, "Start", el("input", { name: "start", type: "time", required: true, value: starting.time, step: "300" })),
        el("label", { class: "field" }, "End", el("input", { name: "end", type: "time", required: true, value: ended.time, step: "300" })),
        el("label", { class: "field wide" }, "Attendees", el("textarea", { name: "attendees", placeholder: "Emails, separated by commas" }, emails.join(", ")))),
      el("div", { class: "footer" },
        el("button", { type: "submit", class: "primary", disabled: busy }, busy ? "Saving…" : "Save changes"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Back")));
  }

  async function save(submitted) {
    submitted.preventDefault();
    const form = submitted.target;
    const start = zonedEpoch(form.elements.date.value, form.elements.start.value, tz());
    const end = zonedEpoch(form.elements.date.value, form.elements.end.value, tz());
    if (end <= start) return setStatus("The end must be after the start", "error");

    const args = target();
    const title = form.elements.title.value.trim();
    if (title !== (event.title || "")) args.title = title;
    if (start !== event.event_start) args.event_start = start;
    if (end !== event.event_end) args.event_end = end;
    const before = guests().map((attendee) => lower(attendee.email)).sort().join(",");
    const after = [...new Set(form.elements.attendees.value.split(/[,;\s]+/).map(lower).filter(Boolean))];
    if ([...after].sort().join(",") !== before) args.attendees = after;
    if (Object.keys(args).length === Object.keys(target()).length) { mode = "view"; return render("Nothing changed"); }

    busy = true;
    form.querySelector("button[type=submit]").disabled = true;
    setStatus("Saving…");
    try {
      event = await callTool("events_edit", args, "The meeting couldn't be saved");
      busy = false;
      mode = "view";
      render("Meeting updated", "ok");
      tellModel(`Updated the meeting "${event.title}" to ${fmtRange(event.event_start, ending(), tz())}.`);
    } catch (error) {
      busy = false;
      setStatus(error.message, "error");
      form.querySelector("button[type=submit]").disabled = false;
    }
  }

  async function cancelEvent() {
    busy = true;
    render();
    try {
      await callTool("events_destroy", target(), "The meeting couldn't be cancelled");
      busy = false;
      mode = "view";
      event = { ...event, status: "cancelled" };
      render("Meeting cancelled", "ok");
      tellModel(`Cancelled the meeting "${event.title}".`);
    } catch (error) {
      busy = false;
      mode = "view";
      render(error.message, "error");
    }
  }

  start("placeos-event-card", { onInput: (args) => { toolInput = args; }, onResult: showResult });
})();
</script>
</body>
</html>
