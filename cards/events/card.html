<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting</title>
<!--
  The event card (MCP Apps), rendered for events_show. Shows a meeting; its host (or the
  owner of the calendar it was read from) can edit it with events_edit or cancel it with
  events_destroy.
  Talks to the host with JSON-RPC over postMessage (ui/initialize, ui/notifications/tool-result,
  tools/call). Tool results are the {status, headers, body} envelope as structuredContent.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1d1f23; --muted: #6b7079; --line: #e3e5e9; --chip: #f1f3f6;
    --accent: #2f6fde; --accent-fg: #ffffff; --danger: #b42318; --ok: #1e6b3a; --error: #b42318;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
      --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d21; --fg: #eceef1; --muted: #9aa0a9; --line: #33363c; --chip: #2a2d33;
    --accent: #5b8ff0; --danger: #f97066; --ok: #9fdcb3; --error: #f97066; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.4; }
  h1 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  section { margin-top: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.wide { grid-column: 1 / -1; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; min-height: 56px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; border-radius: 6px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.6; cursor: default; }
  form .actions { grid-column: 1 / -1; margin-top: 4px; }
  .status { margin-top: 8px; min-height: 1.4em; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  a { color: var(--accent); }
  .carousel { position: relative; margin: 0 0 12px; border-radius: 8px; overflow: hidden; background: var(--chip); }
  .carousel img, .carousel .placeholder { display: block; width: 100%; height: 180px; object-fit: cover; }
  .carousel .placeholder { display: grid; place-items: center; }
  .carousel .nav { position: absolute; top: 50%; transform: translateY(-50%); border: 0; border-radius: 50%; width: 32px; height: 32px; padding: 0; background: rgba(0, 0, 0, 0.45); color: #ffffff; font-size: 20px; line-height: 1; cursor: pointer; }
  .carousel .prev { left: 8px; }
  .carousel .next { right: 8px; }
  .carousel .dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .carousel .dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.6); cursor: pointer; }
  .carousel .dot.active { background: #ffffff; }
  details.map { margin-top: 12px; }
  details.map summary { cursor: pointer; color: var(--accent); }
  .map-frame { margin-top: 8px; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: #ffffff; }
  .map-canvas { position: relative; width: 250%; }
  .map-canvas img { display: block; width: 100%; height: auto; }
  .map-pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #e5484d; border: 3px solid #ffffff; box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.35), 0 1px 4px rgba(0, 0, 0, 0.4); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
  // ---- host bridge: JSON-RPC over postMessage (MCP Apps) ----
  const app = document.getElementById("app");
  let nextId = 1;
  const pending = new Map();
  let toolInput = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || "request failed")) : resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-input": toolInput = (msg.params && msg.params.arguments) || {}; break;
      case "ui/notifications/tool-result": showResult(msg.params); break;
      case "ui/notifications/host-context-changed": applyContext(msg.params); break;
      case "ui/resource-teardown": send({ jsonrpc: "2.0", id: msg.id, result: {} }); break;
      default:
        if (msg.id !== undefined && msg.method) send({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "method not found" } });
    }
  });

  function applyContext(context) {
    if (context && context.theme) document.documentElement.dataset.theme = context.theme;
  }

  // a tool result's {status, headers, body} envelope
  function envelope(result) {
    const content = result && result.structuredContent;
    if (content && typeof content.status === "number") return content;
    const text = result && result.content && result.content.find((item) => item.type === "text");
    try { return text ? JSON.parse(text.text) : null; } catch { return null; }
  }

  function errorText(response, fallback) {
    const body = response && response.body;
    const detail = body && (typeof body === "string" ? body : body.message || body.error);
    return detail ? `${fallback}: ${detail}` : fallback;
  }

  // calls a tool, returning the response body or throwing the error
  async function callTool(name, args, failure) {
    const result = await request("tools/call", { name, arguments: args });
    const response = envelope(result);
    if ((result && result.isError) || !response || response.status >= 400) throw new Error(errorText(response, failure));
    return response.body;
  }

  // the signed in user, for deciding which actions to offer
  let me = null;
  function currentUser() {
    me = me || callTool("users_current", {}, "Unable to load your profile").catch(() => ({}));
    return me;
  }

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child);
    return node;
  }

  function setStatus(text, kind = "") {
    const status = document.getElementById("status");
    if (status) { status.textContent = text; status.className = `status ${kind}`; }
  }

  // ---- time: epochs shown and entered in an IANA timezone ----
  const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function zoneOf(tz) { try { new Intl.DateTimeFormat(undefined, { timeZone: tz }); return tz; } catch { return localZone; } }
  const fmtTime = (epoch, tz) => new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  const fmtDay = (epoch, tz) => new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: zoneOf(tz) }).format(new Date(epoch * 1000));
  // {date: "YYYY-MM-DD", time: "HH:MM"} of an epoch in a timezone
  function wallClock(epoch, tz) {
    const parts = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: zoneOf(tz) }).formatToParts(new Date(epoch * 1000));
    const part = (type) => parts.find((item) => item.type === type).value;
    return { date: `${part("year")}-${part("month")}-${part("day")}`, time: `${part("hour")}:${part("minute")}` };
  }
  // the epoch of a date and time in a timezone
  function zonedEpoch(date, time, tz) {
    const [y, m, d] = date.split("-").map(Number);
    const [h, mi] = time.split(":").map(Number);
    const target = Date.UTC(y, m - 1, d, h, mi) / 1000;
    let epoch = target;
    for (let i = 0; i < 2; i++) {
      const wall = wallClock(epoch, tz);
      const [wy, wm, wd] = wall.date.split("-").map(Number);
      const [wh, wmi] = wall.time.split(":").map(Number);
      epoch += target - Date.UTC(wy, wm - 1, wd, wh, wmi) / 1000;
    }
    return epoch;
  }
  const nextQuarterHour = () => Math.ceil(Date.now() / 900000) * 900;

  // keep the host's frame the size of the content
  new ResizeObserver(() => {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }).observe(document.body);

  function start(name) {
    request("ui/initialize", {
      protocolVersion: "2026-01-26",
      appInfo: { name, version: "1.0.0" },
      appCapabilities: {},
    }).then((result) => {
      applyContext(result && result.hostContext);
      notify("ui/notifications/initialized", {});
    }).catch(() => notify("ui/notifications/initialized", {}));
  }

  // ---- the event card: shows a meeting, its host can edit or cancel it ----
  let event = null;
  let mode = "view"; // view | edit | confirm-cancel
  let busy = false;
  const lower = (value) => String(value || "").toLowerCase();

  const RESPONSES = { accepted: "✓", declined: "✗", tentative: "?", tentativelyaccepted: "?" };

  function showResult(result) {
    const response = envelope(result);
    if (!response || response.status >= 400 || !response.body || !response.body.event_start) {
      app.replaceChildren(el("p", { class: "status error" }, errorText(response, "Unable to load the meeting")));
      return;
    }
    event = response.body;
    mode = "view";
    resetMedia();
    render();
  }

  // ---- the room's photos and level map, from the spaces card's card only tools ----
  // they're updated in place, so a half filled edit form isn't lost
  let media = { room: null, images: {}, index: 0, map: null };
  const room = () => event.system || null;
  const roomName = () => room() ? room().display_name || room().name : "";

  function resetMedia() {
    const id = room() && room().id;
    if (media.room === id) return;
    media = { room: id, images: {}, index: 0, map: null };
    if (id) loadMap();
  }

  function refresh(id, view) {
    const node = document.getElementById(id);
    if (node) node.replaceWith(view());
  }

  async function loadImage(index) {
    if (media.images[index] !== undefined) return;
    const id = media.room;
    media.images[index] = null; // loading
    let src = "error";
    try {
      const result = await request("tools/call", { name: "spaces_image", arguments: { id, index } });
      const image = result && !result.isError && result.content && result.content.find((item) => item.type === "image");
      if (image) src = `data:${image.mimeType};base64,${image.data}`;
    } catch { /* shown as unavailable */ }
    if (media.room !== id) return;
    media.images[index] = src;
    refresh("room-images", carousel);
  }

  function carousel() {
    const count = ((room() && room().images) || []).length;
    if (!count) return el("div", { id: "room-images" });
    const index = Math.min(media.index, count - 1);
    const src = media.images[index];
    if (src === undefined) loadImage(index);
    const show = (target) => { media.index = (target + count) % count; refresh("room-images", carousel); };
    return el("figure", { id: "room-images", class: "carousel" },
      src && src !== "error"
        ? el("img", { src, alt: `${roomName()}, photo ${index + 1} of ${count}` })
        : el("div", { class: "placeholder muted" }, src === "error" ? "Photo unavailable" : "Loading photo…"),
      count > 1 ? [
        el("button", { type: "button", class: "nav prev", title: "Previous photo", onclick: () => show(index - 1) }, "‹"),
        el("button", { type: "button", class: "nav next", title: "Next photo", onclick: () => show(index + 1) }, "›"),
        el("div", { class: "dots" }, Array.from({ length: count }, (_, dot) =>
          el("button", { type: "button", class: dot === index ? "dot active" : "dot", title: `Photo ${dot + 1}`, onclick: () => show(dot) }))),
      ] : null);
  }

  // the level map with a pin on the room, from spaces_map: {src, x, y, box}
  async function loadMap() {
    const id = media.room;
    try {
      const result = await request("tools/call", { name: "spaces_map", arguments: { id } });
      const response = envelope(result);
      const image = result && !result.isError && result.content && result.content.find((item) => item.type === "image");
      const headers = Object.fromEntries(Object.entries((response && response.headers) || {}).map(([key, value]) => [key.toLowerCase(), value]));
      const pin = String(headers["x-map-pin"] || "").split(",").map(Number);
      const box = String(headers["x-map-view-box"] || "").split(/[\s,]+/).map(Number);
      if (!image || pin.length !== 2 || box.length !== 4 || !(box[2] > 0 && box[3] > 0) || media.room !== id) return;
      media.map = { src: `data:${image.mimeType};base64,${image.data}`, x: pin[0], y: pin[1], box };
      refresh("room-map", mapView);
    } catch { /* not on a map */ }
  }

  function mapView() {
    const map = media.map;
    if (!map) return el("div", { id: "room-map" });
    const [minX, minY, width, height] = map.box;
    const pin = el("div", { class: "map-pin", style: `left:${((map.x - minX) / width) * 100}%;top:${((map.y - minY) / height) * 100}%`, title: roomName() });
    const frame = el("div", { class: "map-frame" });
    // centre the pin once the map has its size
    const centre = () => {
      frame.scrollLeft = pin.offsetLeft - frame.clientWidth / 2;
      frame.scrollTop = pin.offsetTop - frame.clientHeight / 2;
    };
    // the SVG is shown as an image, so nothing in it can run
    frame.append(el("div", { class: "map-canvas" }, el("img", { src: map.src, alt: "Level map", onload: centre }), pin));
    return el("details", { id: "room-map", class: "map", ontoggle: (toggled) => { if (toggled.target.open) requestAnimationFrame(centre); } },
      el("summary", {}, "Show on map"), frame);
  }

  // the room the meeting is in, and where it was read from
  const systemId = () => (event.system && event.system.id) || event.system_id || toolInput.system_id;
  const calendar = () => toolInput.calendar || (systemId() ? undefined : event.calendar);

  // the arguments that find this meeting in tool calls
  function target() {
    const args = { id: event.id };
    if (systemId()) args.system_id = systemId();
    if (calendar()) args.calendar = calendar();
    return args;
  }

  function isHost(user) {
    if (!user || !user.email) return false;
    const email = lower(user.email);
    return lower(event.host) === email || lower(event.calendar) === email;
  }

  const people = () => (event.attendees || []).filter((attendee) => !attendee.resource);

  async function render(message, kind) {
    const user = await currentUser();
    const tz = event.timezone || localZone;
    const end = event.event_end || event.event_start + 3600;
    const when = event.all_day
      ? `${fmtDay(event.event_start, tz)}, all day`
      : `${fmtDay(event.event_start, tz)}, ${fmtTime(event.event_start, tz)} – ${fmtTime(end, tz)}`;
    const editable = isHost(user) && end > Date.now() / 1000 && lower(event.status) !== "cancelled";

    // replaceChildren, unlike el(), would show a null child as the text "null"
    app.replaceChildren(...[
      carousel(),
      el("div", { class: "row between" },
        el("h1", {}, event.title || (event.private ? "Private meeting" : "Untitled meeting")),
        lower(event.status) === "cancelled" ? el("span", { class: "chip" }, "Cancelled") : null),
      el("dl", {},
        el("dt", {}, "When"), el("dd", {}, when, tz !== localZone ? el("span", { class: "muted" }, ` (${tz})`) : null),
        roomName() || event.location ? [el("dt", {}, "Where"), el("dd", {}, roomName() || event.location)] : null,
        event.host ? [el("dt", {}, "Host"), el("dd", {}, event.host)] : null,
        people().length ? [el("dt", {}, "Attendees"), el("dd", {}, people().map((attendee) =>
          el("div", {}, attendee.name && attendee.name !== attendee.email ? `${attendee.name} ` : "", el("span", { class: "muted" }, attendee.email),
            RESPONSES[lower(attendee.response_status)] ? ` ${RESPONSES[lower(attendee.response_status)]}` : "")))] : null),
      mapView(),
      event.online_meeting_url ? el("div", { class: "actions" },
        el("button", { type: "button", onclick: () => openLink(event.online_meeting_url) }, "Join online")) : null,
      editable ? actions(tz) : null,
      el("div", { id: "status", class: `status ${kind || ""}`, role: "status" }, message || ""),
    ].filter(Boolean));
  }

  function actions(tz) {
    if (mode === "edit") return editForm(tz);
    if (mode === "confirm-cancel") {
      return el("div", { class: "actions" },
        el("span", {}, "Cancel this meeting and notify the attendees?"),
        el("button", { type: "button", class: "danger", disabled: busy, onclick: cancelEvent }, "Yes, cancel it"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Keep it"));
    }
    return el("div", { class: "actions" },
      el("button", { type: "button", class: "primary", onclick: () => { mode = "edit"; render(); } }, "Edit"),
      el("button", { type: "button", class: "danger", onclick: () => { mode = "confirm-cancel"; render(); } }, "Cancel meeting"));
  }

  function editForm(tz) {
    const starting = wallClock(event.event_start, tz);
    const ending = wallClock(event.event_end || event.event_start + 3600, tz);
    const emails = people().map((attendee) => attendee.email).filter((email) => lower(email) !== lower(event.host));
    return el("form", { onsubmit: save },
      el("label", { class: "wide" }, "Title", el("input", { name: "title", required: true, value: event.title || "", maxlength: "200" })),
      el("label", { class: "wide" }, "Date", el("input", { name: "date", type: "date", required: true, value: starting.date })),
      el("label", {}, "Start", el("input", { name: "start", type: "time", required: true, value: starting.time, step: "300" })),
      el("label", {}, "End", el("input", { name: "end", type: "time", required: true, value: ending.time, step: "300" })),
      el("label", { class: "wide" }, "Attendees (emails, comma separated)", el("textarea", { name: "attendees" }, emails.join(", "))),
      el("div", { class: "actions" },
        el("button", { type: "submit", class: "primary", disabled: busy }, busy ? "Saving…" : "Save"),
        el("button", { type: "button", disabled: busy, onclick: () => { mode = "view"; render(); } }, "Back")));
  }

  async function save(submitted) {
    submitted.preventDefault();
    const form = submitted.target;
    const tz = event.timezone || localZone;
    const start = zonedEpoch(form.date.value, form.start.value, tz);
    const end = zonedEpoch(form.date.value, form.end.value, tz);
    if (end <= start) return setStatus("The end must be after the start", "error");

    const args = target();
    if (form.title.value.trim() !== (event.title || "")) args.title = form.title.value.trim();
    if (start !== event.event_start) args.event_start = start;
    if (end !== event.event_end) args.event_end = end;
    const before = people().map((attendee) => lower(attendee.email)).filter((email) => email !== lower(event.host)).sort().join(",");
    const after = form.attendees.value.split(/[,;\s]+/).map(lower).filter(Boolean);
    if ([...new Set(after)].sort().join(",") !== before) args.attendees = after;
    if (Object.keys(args).length === Object.keys(target()).length) { mode = "view"; return render("Nothing changed"); }

    busy = true;
    setStatus("Saving…");
    try {
      event = await callTool("events_edit", args, "The meeting couldn't be saved");
      busy = false;
      mode = "view";
      render("Meeting updated", "ok");
    } catch (error) {
      busy = false;
      setStatus(error.message, "error");
      form.querySelector("button[type=submit]").disabled = false;
    }
  }

  async function cancelEvent() {
    busy = true;
    setStatus("Cancelling…");
    try {
      await callTool("events_destroy", target(), "The meeting couldn't be cancelled");
      busy = false;
      mode = "view";
      event = { ...event, status: "cancelled" };
      render("Meeting cancelled", "ok");
    } catch (error) {
      busy = false;
      mode = "view";
      render(error.message, "error");
    }
  }

  start("placeos-event-card");
})();
</script>
</body>
</html>
