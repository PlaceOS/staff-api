        Use the `/instance/:instance` routes to change a single occurrence of a recurring
        booking. Times cannot be changed on a linked (child) booking (405).

        Moving to a different asset or outside the original time window resets the
        check-in and approval state and re-checks booking limits (410).

        Changing the time, asset or recurrence re-checks for clashes (409). Changing
        approved/rejected requires admin, support or zone manager access (403).

        Providing attendees replaces the attendee list, creating guests for new attendees.
        Changing user_email moves the booking to that user (404 if unknown) and signals
        `staff/booking/host_changed`.

        Only the booking owner, the person who booked it, admins/support or zone managers
        may update it.'
      tags:
      - Bookings
      operationId: Bookings_update_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Model.Booking'
        required: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: Int64
      - name: instance
        in: path
        description: the occurrence of a recurring booking to act on, the instance
          id (the occurrence start time as a unix epoch in seconds) as returned in
          the booking `instance` field. Omit to act on the booking or whole series
        example: 1661725146
        required: true
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
