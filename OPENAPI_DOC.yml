      operationId: Staff_index
      parameters:
      - name: q
        in: query
        description: An optional search query to filter users by name or email. If
          both 'q' and 'filter' parameters are provided, 'filter' takes precedence.
        example: steve
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: filter
        in: query
        description: An optional advanced search filter using Azure AD filter syntax.
          Provides more control over the search criteria and takes precedence over
          the 'q' parameter. Supports both Azure AD and Google providers.
        example: startsWith(givenName,'ben') or startsWith(surname,'ben')
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: next_page
        in: query
        description: the next page of results, a google page token or graph api URI.
          Normally taken from the `Link` header of the previous response
        schema:
          anyOf:
          - type: "null"
