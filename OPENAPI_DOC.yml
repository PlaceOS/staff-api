      - Events
      operationId: Events_guest_checkin
      parameters:
      - name: id
        in: path
        description: the event id, as found on the calendar being searched
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        required: true
        schema:
          type: string
      - name: guest_id
        in: path
        description: the email (or numeric id) of the guest to check in
        example: person@external.com
        required: true
        schema:
          type: string
      - name: system_id
        in: query
        description: the room (system) id the event is booked in, required except
          for guest tokens
        example: sys-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: calendar
        in: query
        description: calendar to look the event up on, defaults to the room's resource
          calendar; the user needs write access to it
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
