  /api/staff/v1/assets:
    summary: Assets, the individual physical items (each an instance of an asset type)
      tracked by zone, barcode and serial number
    get:
      summary: List assets, filtered by the params provided.
      tags:
      - Assets
      operationId: Assets_index
      parameters:
      - name: zone_id
        in: query
        description: only return assets whose zone_id field is this zone id
        example: zone-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zones
        in: query
        description: comma separated zone ids; only return assets whose zones list
          contains every one of them
        example:
        - zone-1234
        - zone-4567
        schema:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
      - name: type_id
        in: query
        description: only return assets of this asset type id
        example: asset_type-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: order_id
        in: query
        description: only return assets acquired on this asset purchase order id
        example: asset_purchase_order-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: barcode
        in: query
        description: only return assets with exactly this barcode
        example: "1234567"
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: serial_number
        in: query
        description: only return assets with exactly this serial number
        example: "1234567"
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: bookable
        in: query
        description: true returns only bookable assets, false only non-bookable assets;
          omit for both
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: accessible
        in: query
        description: true returns only accessible assets, false only non-accessible
          assets; omit for both
        example: false
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: features
        in: query
        description: comma separated features; returns assets that have any of these
          features
        example:
        - sit-to-stand
        - whiteboard
