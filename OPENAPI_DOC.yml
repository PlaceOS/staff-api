---
openapi: 3.1.0
info:
  description: PlaceOS Staff-API description
  title: staff-api
  version: 1.2.0
paths:
  /api/staff/v1/bookings:
    summary: Bookings of desks, car parking spaces, lockers, visitors and other assets,
      with approval, check-in/out and attendee (guest) management
    get:
      summary: Lists bookings overlapping a time period, with recurring bookings expanded
        into their individual occurrences.
      description: 'Lists bookings overlapping a time period, with recurring bookings
        expanded into their individual occurrences.

        `type` is required unless event_id or ical_uid is provided, which instead
        returns the bookings linked to that calendar event.

        With no `user`, `email` or `zones` the signed in user''s own bookings are
        returned; with `zones` every user''s bookings in those zones are returned.

        Deleted, checked out bookings are excluded by default. Use `booked` instead
        if you only need the ids of assets in use.

        Unauthenticated requests are allowed (tenant resolved from the domain) and
        only return PUBLIC bookings.

        Paginated: follow the `Link` response header (rel="next") to fetch the next
        page.'
      tags:
      - Bookings
      operationId: Bookings_index
      parameters:
      - name: period_start
        in: query
        description: start of the period to search, unix epoch in seconds. Defaults
          to now
        example: 1661725146
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: end of the period to search, unix epoch in seconds. Defaults
          to one hour from now
        example: 1661743123
        schema:
          type: integer
          format: Int64
      - name: type
        in: query
        description: the booking type to search, such as desk, parking, locker, visitor
          or group-event. Required unless event_id or ical_uid is provided
        example: desk
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_deleted
        in: query
        description: when true, deleted and non-deleted bookings are returned (overrides
          `deleted`)
        example: true
        schema:
          type: boolean
      - name: deleted
        in: query
        description: when true, only deleted bookings are returned. Ignored if `include_deleted=true`
        example: true
        schema:
          type: boolean
      - name: include_checked_out
        in: query
        description: when true, checked out and not checked out bookings are returned
          (overrides `checked_out`)
        example: true
        schema:
          type: boolean
      - name: checked_out
        in: query
        description: when true, only checked out bookings are returned. Ignored if
          `include_checked_out=true`
        example: true
        schema:
          type: boolean
      - name: zones
        in: query
        description: only include bookings in any of these zones (e.g. a building
          or level), comma separated zone ids. When provided, bookings of all users
          in the zones are returned unless `user` or `email` is also set
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: email
        in: query
        description: only include bookings owned by the user with this email. If none
          of `user`, `email` or `zones` is set the signed in user's bookings are returned
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: user
        in: query
        description: only include bookings owned by this user id, use `current` for
          the signed in user
        example: user-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_booked_by
        in: query
        description: when `email` or `user` is set (or defaulted to the signed in
          user), also include bookings that user made on behalf of others
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: checked_in
        in: query
        description: true only includes checked in bookings, false only includes bookings
          that have been checked out
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: created_before
        in: query
        description: only include bookings last changed before this time, unix epoch
          in seconds
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: created_after
        in: query
        description: only include bookings last changed after this time, unix epoch
          in seconds
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: approved
        in: query
        description: true only includes approved bookings, false only includes bookings
          that are not approved
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: rejected
        in: query
        description: true only includes rejected bookings, false excludes them. Defaults
          to including both
        example: false
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: extension_data
        in: query
        description: only include bookings whose extension data contains all of these
          key/value pairs, as a JSON object
        example: '{"entry1":"value to match","entry2":1234}'
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: state
        in: query
        description: only include bookings in this process state, a user defined value
          (see update_state)
        example: pending-approval
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: department
        in: query
        description: only include bookings belonging to this department, a user defined
          value
        example: accounting
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: event_id
        in: query
        description: return the bookings linked to this calendar event id (e.g. an
          Office365 or Google event id). When set, `type` is optional and the period,
          zone and user filters are ignored
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: ical_uid
        in: query
        description: return the bookings linked to the calendar event with this iCal
          UID. When set, `type` is optional and the period, zone and user filters
          are ignored
        example: 19rh93h5t893h5v@calendar.iCloud.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: limit
        in: query
        description: the maximum number of bookings to return, defaults to 100
        example: 100
        schema:
          type: integer
          format: Int32
      - name: offset
        in: query
        description: the number of bookings to skip, used for pagination (take the
          next value from the `Link` header)
        example: 0
        schema:
          type: integer
          format: Int32
      - name: recurrence
        in: query
        description: position within the expanded recurring bookings, used for pagination
          (take the next value from the `Link` header)
        example: 0
        schema:
          type: integer
          format: Int32
      - name: permission
        in: query
        description: 'only include bookings with this permission level: PRIVATE, OPEN
          or PUBLIC. Ignored for unauthenticated requests, which only see PUBLIC bookings'
        example: PUBLIC
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: link_ext
        in: query
        description: internal use, a path suffix appended to the pagination `Link`
          header URL
        example: booked
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_parent_bookings
        in: query
        description: when true, linked (child) bookings in the results include their
          parent booking
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceOS.Model.Booking'
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "501":
