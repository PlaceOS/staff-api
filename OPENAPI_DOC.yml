  /api/staff/v1/calendars/availability:
    summary: Calendars, lists the user's calendars and checks room and people availability
      (free/busy) via the tenant's Office365 or Google calendar
    get:
      summary: Finds which rooms or people are free for the whole period, use it to
        find an available room to book.
      description: 'Finds which rooms or people are free for the whole period, use
        it to find an available room to book.

        Specify candidates with `calendars`, `system_ids` and/or `zone_ids` (optionally
        filtered by `features`, `capacity`, `bookable`).

        Returns only the calendars with no busy time overlapping the period, including
        the room''s system details where known.

        Returns 204 with an empty list if no candidate calendars were specified.

        Use `free_busy` instead to see the actual busy times of each calendar.'
      tags:
      - Calendars
      operationId: Calendars_availability
      parameters:
      - name: period_start
        in: query
        description: search period start as a unix epoch in seconds
        example: 1661725146
        required: true
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: search period end as a unix epoch in seconds
        example: 1661743123
        required: true
        schema:
          type: integer
          format: Int64
      - name: calendars
        in: query
        description: a comma separated list of calendar ids (email addresses) to include;
          for room resource calendars prefer `system_ids`
        example: user@org.com,room2@resource.org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zone_ids
        in: query
        description: a comma separated list of zone ids (buildings or levels); all
          rooms (systems with a calendar email) in any of these zones are checked
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: system_ids
        in: query
        description: a comma separated list of room system ids to check
        example: sys-1234,sys-5678
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: features
        in: query
        description: a comma separated list of room features, rooms found via `zone_ids`
          must have all of them
        example: whiteboard,vidconf
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: capacity
        in: query
        example: 8
        schema:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
      - name: bookable
        in: query
        description: only return bookable (true) or non-bookable (false) rooms found
          via `zone_ids`
