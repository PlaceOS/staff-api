    summary: Calendar events (meetings) on user and room resource calendars (Office365
      / Google), with PlaceOS room metadata, room approvals and visitor (guest) management
    post:
      summary: Cancels (declines) the meeting without deleting it, it remains on the
        calendar with a line through it.
      description: 'Cancels (declines) the meeting without deleting it, it remains
        on the calendar with a line through it.

        Use destroy to remove it entirely. Any plain text request body is sent as
        the decline message.

        By default it assumes the event exists on the user''s calendar; use `calendar`
        for another calendar the user can write to,

        and provide `system_id` when the event is booked in a room so its metadata
        is marked cancelled and `staff/event/changed` is signalled.

        The user must be the host or an attendee, or hold a role permitted on the
        room, otherwise 403. 404 if not found.'
      tags:
      - Events
      operationId: Events_decline
      parameters:
      - name: id
        in: path
        description: the event id, as found on the calendar being searched
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        required: true
        schema:
          type: string
      - name: system_id
        in: query
        description: the room (system) id the event is booked in, its resource calendar
          is searched when `calendar` isn't provided
        example: sys-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: calendar
        in: query
        description: calendar the event is on, defaults to the current user's calendar;
          the user needs write access to it
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: notify
