          anyOf:
          - type: "null"
          - type: string
        title:
          anyOf:
          - type: "null"
          - type: string
        checked_in:
          anyOf:
          - type: boolean
          - type: "null"
        checked_in_at:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        checked_out_at:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        description:
          anyOf:
          - type: "null"
          - type: string
        deleted:
          anyOf:
          - type: boolean
          - type: "null"
        deleted_at:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        booked_by_email:
          anyOf:
          - type: string
            format: email
          - type: "null"
        booked_by_name:
          anyOf:
          - type: "null"
          - type: string
        booked_from:
          anyOf:
          - type: "null"
          - type: string
        extension_data:
          anyOf:
          - type: object
          - type: "null"
        history:
          anyOf:
          - type: "null"
          - type: array
            items:
              $ref: '#/components/schemas/PlaceOS.Model.Booking.History'
        parent_id:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        event_id:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
          description: provided if this booking is associated with a calendar event
        instance:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
          description: provided when this booking is an instance of recurring booking
        attendees:
          anyOf:
          - type: "null"
          - type: array
            items:
              $ref: '#/components/schemas/PlaceCalendar.Event.Attendee'
        asset_ids:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        images:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        induction:
          anyOf:
          - $ref: '#/components/schemas/PlaceOS.Model.Booking.Induction'
          - type: "null"
          description: The induction status of the booking. Defaults to TENTATIVE.
        permission:
          anyOf:
          - $ref: '#/components/schemas/PlaceOS.Model.Booking.Permission'
          - type: "null"
          description: The permission level for the booking. Defaults to private.
            If set to private, attendees must be invited.If set to open, users in
            the same tenant can join. If set to public, the booking is open for everyone
            to join.
        recurrence_type:
          anyOf:
          - $ref: '#/components/schemas/PlaceOS.Model.Booking.Recurrence'
          - type: "null"
          description: Is this a recurring booking. This field defines the type of
            recurrence
        recurrence_days:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
          description: a bitmap of valid days of the week for booking recurrences
            to land on, defaults to all days of the week
        recurrence_nth_of_month:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
          description: which day index should a monthly recurrence land on. 1st Monday,
            2nd Monday (used in conjunction with the days bitmap). -1 == last Monday,
            -2 Second last Monday etc
        recurrence_interval:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
          description: 1 == every occurrence, 2 == every second occurrence, etc
        recurrence_end:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
          description: an optional end date for booking recurrences
        all_day:
          anyOf:
          - type: boolean
          - type: "null"
        tenant_id:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        id:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: "null"
