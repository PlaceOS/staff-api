  /api/staff/v1/place:
    summary: Place, the room resources (room mailboxes) defined in the tenant's Office365
      directory. Use systems for PlaceOS rooms
    get:
      summary: List the rooms in the Office365 directory.
      tags:
      - Place
      operationId: Place_index
      parameters:
      - name: match
        in: query
        description: optional comma separated list of room properties to return (maps
          to the graph `$select` parameter)
        example: id,displayName,emailAddress
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: filter
        in: query
        description: optional filter using Azure AD filter syntax (maps to the graph
          `$filter` parameter)
        example: startsWith(displayName,'Board')
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: top
        in: query
        description: optional maximum number of rooms to return (maps to the graph
          `$top` parameter, graph defaults to 100)
        example: 100
        schema:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
      - name: skip
        in: query
        description: optional number of rooms to skip, for paging (maps to the graph
          `$skip` parameter)
        example: 100
        schema:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
