      - Events
      operationId: Events_approve_all
      parameters:
      - name: period_start
        in: query
        description: period start as a unix epoch in seconds
        example: 1661725146
        required: true
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: period end as a unix epoch in seconds
        example: 1661743123
        required: true
        schema:
          type: integer
          format: Int64
      - name: calendars
        in: query
        description: comma separated resource calendar emails; only those resolving
          to a room (system) are approved
