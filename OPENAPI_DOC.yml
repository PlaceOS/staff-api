---
openapi: 3.1.0
info:
  description: PlaceOS Staff-API description
  title: staff-api
  version: 1.2.0
paths:
  /api/staff/v1/bookings:
    get:
      summary: lists bookings based on the parameters provided
      description: 'lists bookings based on the parameters provided


        booking_type is required unless event_id or ical_uid is present'
      tags:
      - Bookings
      operationId: Bookings_index
      parameters:
      - name: period_start
        in: query
        description: booking period start as a unix epoch
        example: 1661725146
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: booking period end as a unix epoch
        example: 1661743123
        schema:
          type: integer
          format: Int64
      - name: type
        in: query
        description: the generic name of the asset whose bookings you wish to view
        example: desk
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_deleted
        in: query
        description: when true, returns all bookings including deleted ones
        example: true
        schema:
          type: boolean
      - name: deleted
        in: query
        description: when true, only returns deleted bookings, unless `include_deleted=true`
        example: true
        schema:
          type: boolean
      - name: include_checked_out
        in: query
        description: when true, returns all bookings including checked out ones
        example: true
        schema:
          type: boolean
      - name: checked_out
        in: query
        description: when true, only returns checked out bookings, unless `include_checked_out=true`
        example: true
        schema:
          type: boolean
      - name: zones
        in: query
        description: this filters only bookings in the zones provided, multiple zones
          can be provided comma seperated
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: email
        in: query
        description: filters bookings owned by this user email
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: user
        in: query
        description: filters bookings owned by this user id
        example: user-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_booked_by
        in: query
        description: if `email` or `user` parameters are set, this includes bookings
          that user booked on behalf of others
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: checked_in
        in: query
        description: filters bookings that have been checked in or not
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: created_before
        in: query
        description: filters bookings that were created before the unix epoch specified
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: created_after
        in: query
        description: filters bookings that were created after the unix epoch specified
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: approved
        in: query
        description: filters bookings that are approved or not
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: rejected
        in: query
        description: filters bookings that are rejected or not
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: extension_data
        in: query
        description: filters bookings with matching extension data entries
        example: '{"entry1":"value to match","entry2":1234}'
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: state
        in: query
        description: filters on the booking process state, a user defined value
        example: pending-approval
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: department
        in: query
        description: filters bookings owned by a department, a user defined value
        example: accounting
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: event_id
        in: query
        description: filters bookings associated with an event, such as an Office365
          Calendar event id
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: ical_uid
        in: query
        description: filters bookings associated with an event, such as an Office365
          Calendar event ical_uid
        example: 19rh93h5t893h5v@calendar.iCloud.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: limit
        in: query
        description: the maximum number of results to return
        example: 10000
        schema:
          type: integer
          format: Int32
      - name: offset
        in: query
        description: the starting offset of the result set. Used to implement pagination
        schema:
          type: integer
          format: Int32
      - name: recurrence
        in: query
        description: the recurring bookings index of the result set. Used to implement
          pagination with recurring bookings
        schema:
          type: integer
          format: Int32
      - name: permission
        in: query
        description: 'filters bookings based on the permission level. Options: PRIVATE,
          OPEN, PUBLIC'
        example: PUBLIC
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: link_ext
        in: query
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_parent_bookings
        in: query
        description: include parent bookings
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceOS.Model.Booking'
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "511":
          description: Network Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ValidationError'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
        "410":
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
    post:
      summary: creates a new booking
      tags:
      - Bookings
      operationId: Bookings_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Model.Booking'
        required: true
      parameters:
      - name: utm_source
        in: query
        description: provided for use with analytics
        example: mobile
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: limit_override
        in: query
        description: allows a client to override any limits imposed on bookings
        example: 3
        schema:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
      - name: event_id
        in: query
        description: links booking with an event, such as an Office365 Calendar event
          id
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: ical_uid
        in: query
        description: links booking with an event, such as an Office365 Calendar event
          ical_uid
        example: 19rh93h5t893h5v@calendar.iCloud.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOS.Model.Booking'
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "511":
          description: Network Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "406":
          description: Not Acceptable
          content:
