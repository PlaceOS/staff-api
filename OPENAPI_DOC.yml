        example: user@org.com,room2@resource.org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zone_ids
        in: query
        description: comma separated list of zone ids, events are listed for every
          room (system) in these zones
        example: zone-123,zone-456
