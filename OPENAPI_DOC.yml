    put:
      summary: patches an existing booking with the changes provided
      description: 'patches an existing booking with the changes provided

        by default it assumes the event exists on the users calendar.

        you can provide a calendar param to override this default

        or you can provide a system id if the event exists on a resource calendar


        Note: event metadata is associated with a resource calendar, not the hosts
        event.

        so if you want to update an event and the metadata then you need to provide
        both

        the `calendar` param and the `system_id` param


        when moving a room from one system to another, the `system_id` param should
        be

        set to the current rooms associated system.

        Then in the event body, the `system_id` field should be the new system.


        Changing `host` hands the meeting to that person. Office365 cannot change
        a

        meeting''s organiser, so this does what a person does in Outlook: the meeting

        is cancelled and sent again from the new host''s calendar, which re-invites

        the attendees and gives the event a new id and ical uid. Recurring meetings

        are refused. A `host` matching the requesting user is ignored, as front ends

        fall back to the current user when they cannot resolve the organiser.


        `extension_data.host_override` instead records who is hosting while leaving

        the meeting on the organiser''s calendar — for deployments that book rooms
        as

        a service account. Send an empty string to clear it. Moving the meeting

        supersedes it, as the new host owns the meeting afterwards.'
      tags:
      - Events
      operationId: Events_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCalendar.Event'
        required: true
      parameters:
      - name: id
        in: path
        description: the event id
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        required: true
        schema:
          type: string
      - name: system_id
        in: query
        description: the event space associated with this event
        example: sys-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: calendar
        in: query
        description: the calendar associated with this event id
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: notify_existing_attendees
        in: query
        description: '(office365 only) set to false when the only change is adding
          attendees, so that existing attendees aren''t notified by email. Warning:
          while false, only the attendee changes are propagated to the provider -
          any other edits in the request body are ignored'
        example: false
