  /api/staff/v1/events:
    summary: Calendar events (meetings) on user and room resource calendars (Office365
      / Google), with PlaceOS room metadata, room approvals and visitor (guest) management
    get:
      summary: Lists calendar events in the period, merged with any PlaceOS metadata
        (room/system, extension data, setup/breakdown).
      description: 'Lists calendar events in the period, merged with any PlaceOS metadata
        (room/system, extension data, setup/breakdown).

        Defaults to the current user''s calendar when none of `calendars`, `zone_ids`
        or `system_ids` are given,

        otherwise events from all the calendars selected by those params are combined
        (`zone_ids` selects every room in the zones).

        Calendars the user can''t access are dropped unless the tenant is delegated
        or uses a service account.

        If some calendars fail the response is 206 with X-Calendar-Errors, X-Calendar-Limit
        and X-Calendar-Issue headers (see `strict`).'
      tags:
      - Events
      operationId: Events_index
      parameters:
      - name: period_start
        in: query
        description: period start as a unix epoch in seconds
        example: 1661725146
        required: true
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: period end as a unix epoch in seconds
        example: 1661743123
        required: true
        schema:
          type: integer
          format: Int64
      - name: calendars
        in: query
        description: comma separated list of calendar ids (email addresses) to list
          events from, prefer `system_ids` for room resource calendars
        example: user@org.com,room2@resource.org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zone_ids
        in: query
        description: comma separated list of zone ids, events are listed for every
          room (system) in these zones
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: system_ids
        in: query
        description: comma separated list of room (system) ids, events are listed
          from each room's resource calendar
        example: sys-1234,sys-5678
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_cancelled
        in: query
        description: include cancelled events, defaults to false
        example: true
        schema:
          type: boolean
      - name: ical_uid
        in: query
        description: only return events with this ical uid
        example: sqvitruh3ho3mrq896tplad4v8
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: filter
        in: query
        description: optional advanced search filter in Microsoft Graph (Azure AD)
          OData filter syntax, passed to the calendar provider
        example: ""
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: strict
        in: query
        description: 'how to respond to calendar errors: `notify` (default) returns
          206 with X-Calendar-Errors headers, `limit` returns 429 if any calendar
          was rate limited, `all` returns 500 on any calendar error'
        example: notify
        schema:
          $ref: '#/components/schemas/Events.Strict'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
