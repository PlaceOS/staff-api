  /api/staff/v1/bookings/clashing-assets:
    summary: Bookings of desks, car parking spaces, lockers, visitors and other assets,
      with approval, check-in/out and attendee (guest) management
    post:
      summary: Checks which assets are already booked for a proposed booking, without
        creating anything.
      description: 'Checks which assets are already booked for a proposed booking,
        without creating anything.

        The body is a booking that requires booking_start, booking_end (unix epoch
        seconds) and booking_type.

        Returns the ids of assets with a clashing booking; if asset_ids or asset_id
        is set only those assets are checked,

        otherwise every asset of that booking_type with a clash is returned.

        Set return_available (requires asset_ids) to get the free assets instead,
        or include_clash_time to get the clashing time ranges.'
      tags:
      - Bookings
      operationId: Bookings_clashing_assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Model.Booking'
        required: true
      parameters:
      - name: return_available
        in: query
        description: when true, return the assets from the booking's asset_ids that
          are NOT booked, so asset_ids must contain every candidate asset
        example: false
        schema:
          type: boolean
      - name: include_clash_time
        in: query
        description: when true, return objects with asset_id, booking_start and booking_end
          for each clash rather than plain asset ids. Cannot be combined with return_available
        example: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/-oArray-oNamedTuple-oasset_id-u00003A-u000020String-nbooking_start-u00003A-u000020Int64-nbooking_end-u00003A-u000020Int64-c-c-pArray-oString-c-c'
        "429":
          description: Too Many Requests
          content:
