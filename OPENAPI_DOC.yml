  /api/staff/v1/bookings/clashing-assets:
    post:
      summary: lists conflicting assets based on booking
      description: 'lists conflicting assets based on booking

        will return a list of asset_ids that are already booked during the specified
        time range

        if asset_ids or asset_id is set on the booking, then it will only return booked
        assets from that list'
      tags:
      - Bookings
      operationId: Bookings_clashing_assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Model.Booking'
        required: true
      parameters:
      - name: return_available
        in: query
        description: return available assets, this requires asset_ids be set to the
          full list
        example: false
        schema:
          type: boolean
      - name: include_clash_time
        in: query
        description: include the clash times, this is not compatible with return_available
        example: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/-oArray-oNamedTuple-oasset_id-u00003A-u000020String-nbooking_start-u00003A-u000020Int64-nbooking_end-u00003A-u000020Int64-c-c-pArray-oString-c-c'
