        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zone_ids
        in: query
        description: '[deprecated] a comma seperated list of zone ids used for events
          or bookings'
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
