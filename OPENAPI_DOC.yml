    get:
      summary: lists known guests (which can be queried) OR locates visitors via meeting
        start and end times (can be filtered by calendars, zone_ids and system_ids)
      tags:
      - Guests
      operationId: Guests_index
      parameters:
      - name: q
        in: query
        description: space seperated search query for guests
        example: steve von
        schema:
          type: string
      - name: period_start
        in: query
        description: event period start as a unix epoch
        example: 1661725146
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: period_end
        in: query
        description: event period end as a unix epoch
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: calendars
        in: query
        description: '[deprecated] a comma seperated list of calendar ids, recommend
          using `system_id` for resource calendars'
