        "511":
          description: Network Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ValidationError'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
        "410":
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
    post:
      summary: Creates a booking of an asset (desk, parking space, locker, visitor,
        etc) for the signed in user or on behalf of another user.
      description: 'Creates a booking of an asset (desk, parking space, locker, visitor,
        etc) for the signed in user or on behalf of another user.

        The body requires booking_start, booking_end (unix epoch seconds), booking_type
        and asset_id or asset_ids; set user_email/user_id to book for someone else.

        Any attendees in the body are created as guests (visitors) of the booking
        and a `staff/guest/attending` signal is sent for each, which typically triggers
        visitor invites.

        Only admins, support or managers of the booking''s zones may create a booking
        that is already approved or rejected (403 otherwise).

        Fails with 409 if the asset is already booked for that time and 410 if the
        user''s concurrent booking limit is reached.

        Returns the created booking and publishes a `staff/booking/changed` signal.'
      tags:
      - Bookings
      operationId: Bookings_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Model.Booking'
        required: true
      parameters:
      - name: utm_source
        in: query
        description: the client or channel making the change, recorded for analytics
        example: mobile
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: limit_override
        in: query
        description: the maximum number of concurrent bookings of this type the user
          may hold in the booking's zones, used instead of the tenant's configured
          booking limit
        example: 3
        schema:
          anyOf:
          - type: integer
            format: Int32
          - type: "null"
      - name: event_id
        in: query
        description: link the booking to this calendar event id (e.g. an Office365
          or Google event id). The event must already have staff-api metadata, otherwise
          422 is returned
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: ical_uid
        in: query
        description: link the booking to the calendar event with this iCal UID. The
          event must already have staff-api metadata, otherwise 422 is returned
        example: 19rh93h5t893h5v@calendar.iCloud.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOS.Model.Booking'
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "511":
          description: Network Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ContentError'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.ValidationError'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
        "410":
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookings.BookingError'
  /api/staff/v1/bookings/booked:
    summary: Bookings of desks, car parking spaces, lockers, visitors and other assets,
      with approval, check-in/out and attendee (guest) management
    get:
      summary: Lists the unique ids of assets (desks, parking spaces, etc) booked
        during a time period, e.g. to find which assets are unavailable.
      description: 'Lists the unique ids of assets (desks, parking spaces, etc) booked
        during a time period, e.g. to find which assets are unavailable.

        Accepts the same filters as listing bookings; `type` is required unless event_id
        or ical_uid is provided.

        Deleted, rejected and checked out bookings are ignored. Unauthenticated requests
        only consider PUBLIC bookings.

        Use `clashing-assets` to check specific assets against a proposed booking
        time instead.'
