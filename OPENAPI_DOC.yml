  /api/staff/v1/bookings/booked:
    summary: Bookings of desks, car parking spaces, lockers, visitors and other assets,
      with approval, check-in/out and attendee (guest) management
    get:
      summary: List the ids of assets booked in a time period.
      tags:
      - Bookings
      operationId: Bookings_booked
      parameters:
      - name: period_start
        in: query
        description: start of the period to search, unix epoch in seconds. Defaults
          to now
        example: 1661725146
        schema:
          type: integer
          format: Int64
      - name: period_end
        in: query
        description: end of the period to search, unix epoch in seconds. Defaults
          to one hour from now
        example: 1661743123
        schema:
          type: integer
          format: Int64
      - name: type
        in: query
        description: the booking type to search, such as desk, parking, locker, visitor
          or group-event. Required unless event_id or ical_uid is provided
        example: desk
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zones
        in: query
        description: only include bookings in any of these zones (e.g. a building
          or level), comma separated zone ids. When provided, bookings of all users
          in the zones are returned unless `user` or `email` is also set
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: email
        in: query
        description: only include bookings owned by the user with this email. If none
          of `user`, `email` or `zones` is set the signed in user's bookings are returned
        example: user@org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: user
        in: query
        description: only include bookings owned by this user id, use `current` for
          the signed in user
        example: user-1234
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: include_booked_by
        in: query
        description: when `email` or `user` is set (or defaulted to the signed in
          user), also include bookings that user made on behalf of others
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: checked_in
        in: query
        description: true only includes checked in bookings, false only includes bookings
          that have been checked out
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: created_before
        in: query
        description: only include bookings last changed before this time, unix epoch
          in seconds
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: created_after
        in: query
        description: only include bookings last changed after this time, unix epoch
          in seconds
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: approved
        in: query
        description: true only includes approved bookings, false only includes bookings
          that are not approved
        example: true
        schema:
          anyOf:
          - type: boolean
          - type: "null"
      - name: extension_data
        in: query
        description: only include bookings whose extension data contains all of these
          key/value pairs, as a JSON object
        example: '{"entry1":"value to match","entry2":1234}'
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: state
        in: query
        description: only include bookings in this process state, a user defined value
          (see update_state)
        example: pending-approval
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: department
        in: query
        description: only include bookings belonging to this department, a user defined
          value
        example: accounting
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: event_id
        in: query
        description: return the bookings linked to this calendar event id (e.g. an
          Office365 or Google event id). When set, `type` is optional and the period,
          zone and user filters are ignored
        example: AAMkAGVmMDEzMTM4LTZmYWUtNDdkNC1hMDZe
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: ical_uid
        in: query
        description: return the bookings linked to the calendar event with this iCal
          UID. When set, `type` is optional and the period, zone and user filters
          are ignored
        example: 19rh93h5t893h5v@calendar.iCloud.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: limit
        in: query
        description: the maximum number of bookings to inspect, defaults to 100000
        example: 100000
        schema:
          type: integer
          format: Int32
      - name: offset
        in: query
        description: the number of bookings to skip, used for pagination (take the
          next value from the `Link` header)
        example: 0
        schema:
          type: integer
          format: Int32
      - name: permission
        in: query
        description: 'only include bookings with this permission level: PRIVATE, OPEN
          or PUBLIC. Ignored for unauthenticated requests, which only see PUBLIC bookings'
        example: PUBLIC
        schema:
          anyOf:
          - type: "null"
          - type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/String'
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
