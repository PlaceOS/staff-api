  /api/staff/v1/guests:
    summary: Guests, visitors (people external to the organisation) stored in PlaceOS
      that are invited to meetings and bookings as attendees
    get:
      summary: Searches known guests, OR lists the visitors expected in a time period.
      description: 'Searches known guests, OR lists the visitors expected in a time
        period.

        Without a period: returns up to 1500 guests ordered by name, matching `q`
        (prefix match on each word) if provided.

        With both `period_start` and `period_end`: returns the guests attending bookings
        in the period (optionally filtered by

        `zones`/`zone_ids`) and calendar events in the period on the rooms matching
        `zone_ids`, `system_ids` or `calendars`,

        each including their attendance details (checked in, visit expected) and the
        event or booking they are visiting.'
      tags:
      - Guests
      operationId: Guests_index
      parameters:
      - name: q
        in: query
        description: space separated search query matching guest name, email etc,
          ignored when a period is provided
        example: steve von
        schema:
          type: string
      - name: period_start
        in: query
        description: visit period start as a unix epoch in seconds, requires period_end
        example: 1661725146
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: period_end
        in: query
        description: visit period end as a unix epoch in seconds, requires period_start
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: calendars
        in: query
        description: '[deprecated] a comma separated list of calendar ids to search
          for events with visitors, prefer `system_ids` for room calendars'
        example: user@org.com,room2@resource.org.com
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zone_ids
        in: query
        description: '[deprecated] a comma separated list of zone ids, filters bookings
          and selects the rooms whose events are searched'
        example: zone-123,zone-456
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: system_ids
        in: query
        description: '[deprecated] a comma separated list of room system ids whose
          events are searched'
        example: sys-1234,sys-5678
        schema:
          anyOf:
          - type: "null"
          - type: string
      - name: zones
        in: query
        description: a comma separated list of zone ids, only bookings in these zones
          are included
        example:
        - zone-123
        - zone-456
        schema:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceOS.Model.Guest'
        "429":
          description: Too Many Requests
          content:
