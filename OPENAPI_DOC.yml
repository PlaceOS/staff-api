      operationId: Surveys::Answers_index
      parameters:
      - name: survey_id
        in: query
        description: only return answers submitted for this survey id
        example: 1234
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      - name: created_after
        in: query
        description: only return answers created at or after this time, as a unix
          timestamp in seconds (defaults to 0)
        example: 1661743123
        schema:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
