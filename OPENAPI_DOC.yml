            format: email
          - type: "null"
        user_name:
          anyOf:
          - type: "null"
          - type: string
        zones:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        process_state:
          anyOf:
          - type: "null"
          - type: string
        last_changed:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        approved:
          anyOf:
          - type: boolean
          - type: "null"
        approved_at:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        rejected:
          anyOf:
          - type: boolean
          - type: "null"
        rejected_at:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        approver_id:
          anyOf:
          - type: "null"
          - type: string
        approver_name:
          anyOf:
          - type: "null"
          - type: string
        approver_email:
