        the updated event (PATCH and PUT behave the same).
      description: 'Updates an existing calendar event with the changes provided and
        returns the updated event (PATCH and PUT behave the same).

        The body is the event as it should be after the change, `event_start` and
        `event_end` are required.

        The user must be the host or an attendee, or hold a role permitted on the
        room (system), otherwise 403.


        By default it assumes the event exists on the user''s calendar.

        You can provide a `calendar` param to override this default,

        or a `system_id` if the event exists on a room''s resource calendar.


        Note: event metadata is associated with a resource calendar, not the host''s
        event,

        so to update an event and its metadata provide both the `calendar` and the
        `system_id` params.

        `extension_data` is merged into the existing metadata, `staff/event/changed`
        is signalled and newly

        expected visitors (`visit_expected: true`) are saved as guests with `staff/guest/attending`
        signalled.


        When moving the meeting from one room to another, the `system_id` param should
        be

        the current room''s system and the `system_id` field in the event body the
        new system.


        Changing `host` hands the meeting to that person. Office365 cannot change
        a

        meeting''s organiser, so this does what a person does in Outlook: the meeting

        is cancelled and sent again from the new host''s calendar, which re-invites

        the attendees and gives the event a new id and ical uid. Recurring meetings

        are refused. A `host` matching the requesting user is ignored, as front ends

        fall back to the current user when they cannot resolve the organiser.


        `extension_data.host_override` instead records who is hosting while leaving

        the meeting on the organiser''s calendar, for deployments that book rooms
        as

        a service account. Send an empty string to clear it. Moving the meeting

        supersedes it, as the new host owns the meeting afterwards.'
