    post:
      summary: Creates a calendar event (meeting) on the host's calendar and returns
        it; the calendar provider sends the invitations.
      description: 'Creates a calendar event (meeting) on the host''s calendar and
        returns it; the calendar provider sends the invitations.

        `host` defaults to the current user. Booking for someone else requires write
        access to their calendar

        (or a delegated tenant), otherwise 403. The host is added as an accepted attendee.

        `event_start` and `event_end` are required (400); `timezone` defaults to the
        `timezone` query param or the server default.

        Set `system_id` to book a room: its resource calendar is invited as a resource,
        the PlaceOS metadata

