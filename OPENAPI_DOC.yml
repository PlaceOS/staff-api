            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "501":
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application.CommonError'
        "511":
          description: Network Authentication Required
          content:
