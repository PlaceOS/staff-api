name: staff-api
version: 1.2.0

targets:
  staff-api:
    main: src/staff-api.cr

dependencies:
  action-controller:
    github: spider-gazelle/action-controller
    version: ">= 5.1"

  placeos-models:
    github: placeos/models

  placeos-log-backend:
    github: place-labs/log-backend
    version: ">= 0.8.13"

  place_calendar:
    github: PlaceOS/calendar

  promise:
    github: spider-gazelle/promise

  # Redis client used to publish signals (supports clustered redis)
  redis-cluster:
    github: place-labs/redis-cluster.cr

  secrets-env:
    github: place-labs/secrets-env

  dns:
    github: spider-gazelle/dns

development_dependencies:
  ameba:
    github: veelenga/ameba
  faker:
    github: askn/faker
  webmock:
    github: manastech/webmock.cr
  timecop:
    github: crystal-community/timecop.cr
